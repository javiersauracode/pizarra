<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pizarra">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F6F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E10" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Pizarra</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#F6F5F2; --surface:#FFFFFF; --surface2:#EEECE7; --text:#16161A; --muted:#6B6A70; --line:#E3E1DB;
  --accent:#FF5A36; --danger:#E5484D;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0E0E10; --surface:#17171A; --surface2:#222226; --text:#F2F1EE; --muted:#9A99A0; --line:#2B2B30; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
svg.i{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:26px;line-height:1.15;margin:0;letter-spacing:-.02em}
h2{font-size:17px;margin:0;letter-spacing:-.01em}
.cap::first-letter{text-transform:uppercase}
.muted{color:var(--muted)} .small{font-size:13px}
p{margin:6px 0}

/* ---------- Layout ---------- */
#app{display:flex;min-height:100vh;min-height:100dvh}
#side{width:276px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);height:100vh;height:100dvh;position:sticky;top:0;overflow-y:auto;
  padding:calc(16px + env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:2px}
#scrim{display:none}
@media (max-width:899px){
  #side{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 40px rgba(0,0,0,.25)}
  body.nav-open #side{transform:none}
  body.nav-open #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
}
#main{flex:1;min-width:0}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar .t{font-weight:650;font-size:16px;flex:1}
@media (min-width:900px){ .icon-btn.menu-btn{display:none} .topbar{padding-left:20px} }
/* márgenes laterales: respetan la muesca del iPhone en horizontal y crecen en pantallas grandes */
#view{--gx:max(16px,env(safe-area-inset-left),env(safe-area-inset-right));padding:20px var(--gx) 170px;max-width:960px;margin:0 auto}
.topbar{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
@media (min-width:900px){ #view{--gx:24px} .topbar{padding-left:20px} }
section{margin-top:28px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px}
.icon-btn:hover{background:var(--surface2)}

/* ---------- Sidebar ---------- */
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--text);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:19px;letter-spacing:-.05em}
.brand b{font-size:19px;letter-spacing:-.03em;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:10px;text-align:left;min-height:44px}
.nav > span:first-of-type{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav:hover{background:var(--surface2)}
.nav.on{background:var(--text);color:var(--bg)}
.nav.on .count{color:inherit;opacity:.7}
.nav.sub{min-height:40px;padding:8px 10px}
.nav.off{opacity:.42}
.nav .eye{font-size:11px;color:var(--muted)}
.count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block}
.group{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.group-h{display:flex;align-items:center;gap:6px;width:100%;padding:4px 6px 4px 8px;font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);min-height:38px}
.group-h > span:nth-of-type(1){flex:1;text-align:left}
.group-h > .i{width:14px;height:14px;transition:transform .2s}
.group-h.open > .i{transform:rotate(90deg)}
.group-h .add{width:30px;height:30px;display:grid;place-items:center;border-radius:8px}
.group-h .add:hover{background:var(--surface2);color:var(--text)}
.hint{color:var(--muted);font-size:13px;padding:6px 10px;margin:0}

/* ---------- Buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;justify-content:center;background:var(--text);color:var(--bg);border-radius:10px;padding:0 16px;min-height:44px;font-weight:600;white-space:nowrap}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.danger{color:var(--danger)}
.btn.btn-danger{background:var(--danger);color:#fff}
.btn .i{width:16px;height:16px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;font-size:16px;outline:none;min-width:0}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none}
textarea{resize:vertical;min-height:84px}
input:focus,select:focus,textarea:focus{border-color:var(--text)}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(68px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:18px;background:var(--accent);color:#fff;display:grid;place-items:center;
  box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 40%,transparent);z-index:30}
.fab .i{width:26px;height:26px;stroke-width:2.4}
/* Configuración: solo un icono, abajo del todo en la barra lateral */
.side-gear{margin-top:auto;align-self:flex-start;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.side-gear .i{width:22px;height:22px}
.side-gear:hover{background:var(--surface2);color:var(--text)}
.side-gear.on{background:var(--text);color:var(--bg)}
/* ---------- Hábitos ---------- */
.hb-hero{display:flex;align-items:center;gap:16px;background:#141417;color:#F2F1EE;border-radius:18px;padding:16px 18px;margin-top:6px;--rc:#F5C518;transition:background .4s}
.hb-hero .muted{color:#B9B8BE}
.hb-hero b{font-size:17px;line-height:1.25}
.hb-hero.full{background:linear-gradient(135deg,#141417,#1f3a2a);--rc:#2BD47D}
.hb-hero.full .ring{animation:ringPop .6s cubic-bezier(.2,1.6,.4,1)}
.ring.big{width:84px;height:84px;transition:background .5s}
.ring.big span{width:66px;height:66px;font-size:19px;color:#F2F1EE}
.hb-flame{margin-top:6px;font-size:13px;color:#F5C518}
.hb-today{display:grid;gap:8px}
.hb-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);transition:background .25s,border-color .25s,transform .15s}
.hb-card:active{transform:scale(.98)}
.hb-check{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;border:2.5px solid var(--hc);color:transparent;transition:background .25s,color .25s}
.hb-check .i{width:19px;height:19px;stroke-width:3}
.hb-txt{flex:1;min-width:0}
.hb-txt b{display:block;font-size:15.5px}
.hb-txt small{display:block;color:var(--muted);font-size:12.5px}
.hb-st{font-weight:800;font-size:14px;white-space:nowrap}
.hb-card.on{background:color-mix(in srgb,var(--hc) 16%,var(--surface));border-color:var(--hc)}
.hb-card.on .hb-check{background:var(--hc);color:#fff}
.hb-card.on .hb-txt b{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--text) 40%,transparent)}
.hb-card.pop .hb-check{animation:checkPop .5s cubic-bezier(.2,1.8,.4,1)}
.hb-card.pop{animation:cardGlow .7s ease-out}
.hb-week{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 10px 6px}
.hb-wrow{display:grid;grid-template-columns:minmax(0,1fr) repeat(7,32px);gap:4px;align-items:center;margin-bottom:6px}
.hb-wrow.head span{font-size:11px;font-weight:700;color:var(--muted);text-align:center;line-height:1.1}
.hb-wrow.head span small{display:block;font-weight:600;font-size:10.5px}
.hb-wrow.head .tdy{color:var(--accent)}
.hb-wname{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-dot{width:28px;height:28px;border-radius:50%;justify-self:center;display:grid;place-items:center;border:2px solid color-mix(in srgb,var(--hc) 55%,var(--line));color:#fff}
.hb-dot .i{width:15px;height:15px;stroke-width:3}
.hb-dot.on{background:var(--hc);border-color:var(--hc)}
.hb-dot.pop{animation:checkPop .5s cubic-bezier(.2,1.8,.4,1)}
.hb-dot.rest{width:6px;height:6px;border:0;background:var(--line)}
.hb-hist{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--hc);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.hb-hh{display:flex;align-items:center;gap:10px}
.hb-hh .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.hb-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 10px}
.hb-stats div{background:var(--surface2);border-radius:10px;padding:7px 4px;text-align:center}
.hb-stats b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.hb-stats small{display:block;font-size:10.5px;color:var(--muted);line-height:1.15}
@media (min-width:700px){
  .hb-today{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .hb-histgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:10px}
  .hb-histgrid .hb-hist{margin-bottom:0}
  .hb-hist .hm{grid-auto-columns:minmax(0,17px)}
  .hb-wrow{grid-template-columns:minmax(0,1fr) repeat(7,minmax(32px,52px))}
}
.hm{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.hm i{aspect-ratio:1;border-radius:3px;background:var(--surface2)}
.hm i.on{background:var(--hc)}
.hm i.miss{background:color-mix(in srgb,var(--hc) 12%,var(--surface2))}
.hm i.off{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.hm i.fut{background:transparent}
.hm i.today{outline:2px solid var(--text);outline-offset:1px}
.confetti{position:fixed;left:50%;top:38%;z-index:90;pointer-events:none}
.confetti i{position:absolute;width:9px;height:14px;border-radius:2px;opacity:0;animation:confetti 1.3s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes confetti{0%{opacity:1;transform:translate(0,0) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translate(var(--x),calc(var(--y) + 260px)) rotate(var(--r))}}
@keyframes checkPop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes cardGlow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--hc) 55%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes ringPop{0%{transform:scale(.85)}100%{transform:scale(1)}}
.lib-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.lib-card .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 4px 0 2px;vertical-align:0}
.set-tabs button span{white-space:nowrap}
@media (max-width:400px){ .set-tabs button{gap:4px;font-size:13px} .set-tabs button .i{width:15px;height:15px} }
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* pestañas de Configuración */
.set-tabs{display:flex;gap:4px;background:var(--surface2);border-radius:12px;padding:3px;margin:14px 0 6px}
.set-tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.set-tabs button .i{width:17px;height:17px}
.set-tabs button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* ---------- Common blocks ---------- */
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
h3.sec{display:flex;align-items:center;gap:8px;font-size:14px;margin:20px 0 8px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--text);margin-bottom:2px}
.pchips,.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gx,16px));padding:12px var(--gx,16px) 4px}
.pchips::-webkit-scrollbar,.pills::-webkit-scrollbar{display:none}
.pchip{display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;white-space:nowrap;min-height:34px;font-weight:500}
.pchip .dot{background:var(--pc)}
.pchip.off{opacity:.42;text-decoration:line-through}
.pchip.on{background:color-mix(in srgb,var(--pc) 18%,var(--surface));border-color:var(--pc);font-weight:650}
.pchip.dim{opacity:.5}
.pchip.clear{padding:0;width:34px;justify-content:center;flex-shrink:0;background:var(--text);color:var(--bg);border-color:var(--text)}
.pchip.clear .i{width:16px;height:16px}
.nav.sub.psel{font-weight:650}
.nav.sub.psel .eye .i{width:15px;height:15px;color:var(--text)}
.nav.sub.off{opacity:.5}
.pill{padding:0 12px;border-radius:999px;background:var(--surface2);font-size:13px;white-space:nowrap;font-weight:550;min-height:34px}
.pill.on{background:var(--text);color:var(--bg)}
.pill b{opacity:.6;font-weight:500;margin-left:3px}

/* ---------- Content rows ---------- */
.crow{position:relative;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 10px 12px 18px;margin-bottom:8px;cursor:pointer;overflow:hidden}
.crow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--pc)}
.crow:hover{border-color:color-mix(in srgb,var(--text) 25%,var(--line))}
.cbody{flex:1;min-width:0}
.ctl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmeta{font-size:13px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{font-size:12px;font-weight:650;padding:5px 10px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb,var(--sc) 15%,transparent);color:var(--sc);flex-shrink:0}
.st-idea{--sc:#8A8A93}.st-guion{--sc:#9B51E0}.st-grabado{--sc:#C98500}.st-editado{--sc:#2F80ED}.st-programado{--sc:#FF5A36}.st-publicado{--sc:#18A957}

/* ---------- Today ---------- */
.hello .date{font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{font-size:26px;display:block;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}

/* ---------- Calendar ---------- */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calnav{display:flex;align-items:center;gap:2px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);font-size:12px;color:var(--muted);text-align:center;margin:12px 0 4px;font-weight:650}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 2px 6px;border-radius:10px;min-height:64px;background:var(--surface);border:1.5px solid transparent;min-width:0}
.cell.out{opacity:.38}
.cell .dn{font-size:14px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.cell.today .dn{background:var(--accent);color:#fff}
.cell.sel{border-color:var(--text)}
/* marcas del día: forma = tipo, color = perfil/proyecto, relleno = hecho */
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:39px}
.dots i{width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ic)}
.dots i.on{background:var(--ic)}
.dots i.k-s{border-radius:3px}
.dots i.k-m{border-radius:1px;transform:rotate(45deg) scale(.8)}
.dots i.k-e{border-radius:2px;background:var(--ic);box-shadow:none;opacity:.55}
.dots b{font-size:9px;font-weight:750;color:var(--muted);line-height:11px;min-width:11px;text-align:center}
.cell.blank{background:transparent;pointer-events:none}
/* calendario en su propia caja con scroll: ~5 semanas a la vista y el día debajo */
.calbox{position:relative;height:clamp(220px,48vh,430px);overflow-y:auto;overscroll-behavior:contain;margin-top:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch}
.month{padding-bottom:6px}
.mhead{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 2px 2px}
.mhead h2{font-size:17px;letter-spacing:-.02em}
.mhead .wk{margin:4px 0 4px}
.daypanel{margin-top:16px}
/* visor del día por horas */
.dv-head{display:flex;align-items:center;gap:4px;margin-bottom:8px}
.dv-title{flex:1;min-width:0;text-align:center}
.dv-title h2{font-size:16px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dv-switch{display:flex;background:var(--surface2);border-radius:10px;padding:2px;flex-shrink:0}
.dv-switch button{width:34px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.dv-switch button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.dv-switch .i{width:18px;height:18px}
.dv-mk i.k-t{border-radius:3px}
/* vista del día en árbol */
.dt{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.dt-proj{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--pc);border-radius:14px;padding:10px 10px 6px 12px}
.dt-h{display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:4px}
.dt-h .dot{width:10px;height:10px;border-radius:50%;background:var(--pc);flex-shrink:0}
.dt-h b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt-sub{position:relative;margin:6px 0 6px 4px;padding-left:14px;border-left:2px solid color-mix(in srgb,var(--pc) 35%,var(--line))}
.dt-sh{font-size:11.5px;font-weight:750;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:2px 0 6px}
.dt-row{position:relative;margin-bottom:4px}
.dt-row::before{content:"";position:absolute;left:-14px;top:50%;width:10px;height:2px;background:color-mix(in srgb,var(--pc) 35%,var(--line))}
.dt-row{overflow:visible}
.dv-title small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dv-all{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.dv-lbl{width:44px;flex-shrink:0;font-size:11px;font-weight:700;color:var(--muted);padding-top:9px;text-align:right}
.dv-chips{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.dv-chip,.dv-ev{display:flex;align-items:flex-start;gap:6px;border-radius:8px;background:color-mix(in srgb,var(--pc) 16%,var(--surface));border-left:4px solid var(--pc);padding:5px 6px 5px 4px;cursor:pointer;min-width:0;overflow:hidden}
.dv-chip.done,.dv-ev.done{opacity:.55}
.dv-chip.done b,.dv-ev.done b{text-decoration:line-through}
.dv-t{flex:1;min-width:0}
.dv-t b{display:block;font-size:13.5px;font-weight:650;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dv-t small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dv-mk{width:22px;height:22px;display:grid;place-items:center;flex-shrink:0;margin-top:-1px}
.dv-mk i{display:block;width:13px;height:13px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ic)}
.dv-mk i.on{background:var(--ic)}
.dv-mk i.k-s{border-radius:3px}
.dv-mk i.k-e{border-radius:3px;background:var(--ic);box-shadow:none;opacity:.6}
.dv-mk i.k-e.on{opacity:1}
.dv-mk i.k-m{border-radius:1px;transform:rotate(45deg) scale(.82)}
.dv-mk i.k-h{box-shadow:none;border:2px dashed var(--ic)}
.dv-mk i.k-h.on{border-style:solid}
.dv-grid{position:relative;height:clamp(260px,62vh,640px);overflow-y:auto;overscroll-behavior:contain;border-top:1px solid var(--line);border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch}
.dv-inner{position:relative}
.dv-hr{position:absolute;left:0;right:0;height:56px;border-top:1px solid var(--line);cursor:pointer}
.dv-hr span{position:absolute;left:0;top:-8px;width:44px;text-align:right;font-size:11px;font-weight:600;color:var(--muted);background:var(--bg);padding-right:6px;font-variant-numeric:tabular-nums}
.dv-hr:first-child span{top:2px}
.dv-evs{position:absolute;left:50px;right:4px;top:0;bottom:0;pointer-events:none}
.dv-ev{position:absolute;pointer-events:auto;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.dv-now{position:absolute;left:44px;right:0;height:2px;background:var(--danger);z-index:3;pointer-events:none}
.dv-now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--danger)}
.dv-now span{position:absolute;left:-46px;top:-8px;font-size:11px;font-weight:750;color:var(--danger);background:var(--bg);padding:0 3px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--muted);margin-right:5px;vertical-align:-1px}
.legend i.on{background:var(--muted)}
.legend i.sq{border-radius:3px}
.legend i.dia{border-radius:1px;transform:rotate(45deg) scale(.8)}
.legend i.ev{border-radius:2px;background:var(--muted);box-shadow:none;opacity:.55}
.cal-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cal-row:last-child{border-bottom:0}
.cal-row .dot{width:12px;height:12px;border-radius:50%;flex:none}
.cal-row b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-ro p{margin:6px 0}
.crow > .cb{flex-shrink:0}
.crow > .cb.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.crow.done .ctl{text-decoration:line-through;color:var(--muted)}
.crow > .dia{width:11px;height:11px;transform:rotate(45deg);background:var(--pc);flex-shrink:0;margin:0 6px}
.st-acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.st-acts .calchip{margin-top:0}
.st-date{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;color:var(--muted);padding:0 10px;min-height:30px;border-radius:999px;border:1px solid var(--line)}
.st-date .i{width:13px;height:13px}
.st-date.late{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.chips{display:none}
@media (min-width:760px){
  .calbox{height:min(62vh,700px)}
  .cell{align-items:stretch;min-height:108px;padding:6px}
  .cell .dn{align-self:flex-start}
  .dots{display:none}
  .chips{display:flex;flex-direction:column;gap:3px;min-width:0}
  .chip{font-size:11.5px;text-align:left;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--pc) 15%,transparent);border-left:3px solid var(--pc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip.pub{opacity:.5}
  .chip.k-s{background:transparent;border:1px dashed color-mix(in srgb,var(--pc) 60%,transparent);border-left:3px solid var(--pc)}
  .chip.k-m{font-weight:700}
  .chip.k-e{background:color-mix(in srgb,var(--pc) 16%,transparent);border-left:3px solid var(--pc)}
  .more{font-size:11px;color:var(--muted);padding-left:6px;text-align:left}
}
/* Pantallas anchas (ordenador, iPad en horizontal): calendario a la izquierda y el día a la derecha */
@media (min-width:1150px){
  #view[data-v=calendario],#view[data-v=habitos]{max-width:1320px}
  .calwrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start}
  .calwrap .calbox{height:calc(100dvh - var(--tb,58px) - 150px);min-height:440px}
  .calwrap .daypanel{margin-top:10px;position:sticky;top:calc(var(--tb,58px) + 10px)}
  .calwrap .dv-grid{height:calc(100dvh - var(--tb,58px) - 290px);min-height:320px}
  .calwrap .dt{max-height:calc(100dvh - var(--tb,58px) - 290px);overflow-y:auto}
  #view[data-v=calendario]{padding-bottom:24px}
  .fab{bottom:28px}
}
/* Móvil en horizontal: sin vista previa encima del formulario, que no cabe */
@media (max-height:500px) and (orientation:landscape){
  .pv{display:none}
  body .has-pv > .sheet{max-height:calc(100dvh - 24px)}
}

/* ---------- Projects & tasks ---------- */
.ptag{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.prow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:6px 0 2px}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin:14px 0 6px}
.bar span{display:block;height:100%;border-radius:3px;transition:width .3s}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;margin:20px 0 12px}
.seg button{flex:1;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);min-height:38px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.quick{display:flex;gap:6px;margin-bottom:14px}
.quick input{flex:1}
.quick select{width:auto;flex-shrink:0}
.quick .btn{width:44px;padding:0;flex-shrink:0}
.task{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px 8px 10px;margin-bottom:6px}
.task.tree{margin-left:calc(var(--lvl) * 18px);padding-left:4px}
.task.tree.child{border-left:3px solid color-mix(in srgb,var(--text) 18%,var(--line))}
.tw{width:24px;height:30px;display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.tw .i{width:16px;height:16px;transition:transform .2s}
.tw.open .i{transform:rotate(90deg)}
.cb{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;flex-shrink:0;color:transparent}
.cb .i{width:15px;height:15px;stroke-width:3}
.task.done .cb{background:var(--text);border-color:var(--text);color:var(--bg)}
.task.done .ttl{text-decoration:line-through;color:var(--muted)}
.tmain{flex:1;min-width:0;cursor:pointer;padding:2px 0}
.ttl{font-weight:550;line-height:1.3;overflow-wrap:anywhere}
.tmeta{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:12px;color:var(--muted);margin-top:3px;align-items:center}
.prio{font-weight:750;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.prio.alta{color:var(--danger)} .prio.media{color:#C98500} .prio.baja{color:var(--muted)}
.late{color:var(--danger);font-weight:650}
.tact{display:flex;flex-shrink:0}
.tact button{width:32px;height:36px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.tact button:hover{background:var(--surface2);color:var(--text)}
.tact .i{width:16px;height:16px}
.donebox{margin-top:20px}
.donebox summary{cursor:pointer;color:var(--muted);font-weight:600;padding:8px 0}

/* ---------- Profiles ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--pc)}
.pcard.off{opacity:.55}
.pcard-top{display:flex;gap:10px;align-items:center}
.avatar{width:42px;height:42px;border-radius:12px;background:var(--pc);color:#fff;display:grid;place-items:center;font-weight:750;flex-shrink:0}
.pcard-act,.row-btns{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Sheet ---------- */
#sheet{position:fixed;inset:0;z-index:60;display:none}
#sheet.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45);animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92dvh;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;
  padding:6px 16px calc(16px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
@media (min-width:700px){
  .sheet{left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);width:540px;border-radius:18px;padding:16px 20px 20px;animation:fade .2s}
  .grab{display:none}
}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
/* Vista previa en vivo: el cuarto superior de la pantalla, sobre el fondo oscurecido */
.has-pv > .sheet{max-height:calc(75dvh - 6px)}
.pv{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);height:calc(25dvh - env(safe-area-inset-top) - 18px);min-height:120px;overflow:hidden;
  background:var(--bg);border-radius:18px;padding:8px 12px 10px;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:fade .25s;
  display:flex;flex-direction:column}
.pv-l{font-size:10.5px;font-weight:750;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.pv-b{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:8px}
.pv-b .crow,.pv-b .task{margin-bottom:0}
.pv-row{display:flex;gap:10px;align-items:center;min-width:0}
.pv-row > :last-child{flex:1;min-width:0}
.pv-cell{width:50px;flex-shrink:0;min-height:58px;pointer-events:none}
.pv-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0}
.pv-card .step{border-top:0;padding:2px 0}
.pv-tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;color:var(--muted)}
.pv-tag .dot{width:8px;height:8px;border-radius:50%;background:var(--pc)}
.pv .rm-hero{margin:0;padding:12px 14px}
.pv .rm-hero h2{font-size:18px}
.pv .rm-hero .goal{font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pv .ph{margin:0}
.pv .ph-obj{font-size:12.5px;padding:6px 10px;margin:0 12px 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pv .habit{border-top:0;padding:0}
.pv .st-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm-opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 4px;border-top:1px solid var(--line)}
.cm-opt b{display:block}
.cm-opt small{display:block;color:var(--muted);font-size:12.5px}
.cm-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;background:color-mix(in srgb,var(--pc) 14%,transparent);color:var(--pc)}
.cm-ic .dots i{width:14px;height:14px}
.cm-ic .i{width:18px;height:18px}
.pv .rituals{margin:0}
@media (min-width:700px){
  .pv{left:50%;right:auto;width:540px;transform:translateX(-50%)}
  .has-pv > .sheet{top:auto;bottom:16px;transform:translateX(-50%);max-height:calc(75dvh - 26px)}
}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;min-width:0}
.field.half{grid-column:auto}
/* Formularios con campos a tercios (p. ej. macros): rejilla de 6 y casillas más compactas */
.fields:has(.field.third){grid-template-columns:repeat(6,1fr);gap:10px}
.fields:has(.field.third) .field.half{grid-column:span 3}
.field.third{grid-column:span 2}
.fields:has(.field.third) .field.half input,.field.third input{padding-top:8px;padding-bottom:8px;min-height:0;font-size:15px}
.fields:has(.field.third) label{font-size:12px}
.field > label{font-size:13px;font-weight:600;color:var(--muted)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{position:relative;cursor:pointer}
.sw input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;min-height:0}
.sw span{display:block;width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.sw input:checked + span{box-shadow:0 0 0 2px var(--text)}
.cgrid{margin-top:12px}
.cgrid summary{list-style:none;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;min-height:32px}
.cgrid summary::-webkit-details-marker{display:none}
.cgrid summary .i{width:16px;height:16px;transition:transform .2s}
.cgrid[open] summary .i{transform:rotate(90deg)}
.cgrid-g{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:8px}
.cgrid .sq{position:relative;cursor:pointer}
.cgrid .sq input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;min-height:0}
.cgrid .sq span{display:block;aspect-ratio:1;border-radius:5px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.cgrid .sq input:checked + span{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--text);position:relative;z-index:1}
.time5{display:flex;align-items:center;gap:4px}
.time5 select{flex:1;min-width:0}
.time5 b{color:var(--muted)}
.daypick{display:flex;gap:6px}
.daypick label{flex:1;position:relative;cursor:pointer}
.daypick input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;min-height:0}
.daypick span{display:grid;place-items:center;height:40px;border-radius:10px;background:var(--surface2);font-weight:700;font-size:14px;color:var(--muted)}
.daypick input:checked + span{background:var(--text);color:var(--bg)}
.habit .h-main{cursor:pointer}
.check{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-weight:600}
.check input{width:22px;height:22px;min-height:0;accent-color:var(--text)}
.sheet-f{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}

/* ---------- Hoja de ruta ---------- */
.rm-hero{position:relative;overflow:hidden;border-radius:18px;padding:18px;background:#141417;color:#F2F1EE;margin-bottom:12px;border:1px solid #26262b}
.rm-hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--rc) 35%,transparent),transparent 70%);pointer-events:none}
.rm-hero .eyebrow{font-size:11px;font-weight:750;letter-spacing:.14em;text-transform:uppercase;color:var(--rc)}
.rm-hero h2{font-size:23px;margin:4px 0 4px;letter-spacing:-.02em;line-height:1.15}
.rm-hero .goal{color:#B9B8BE;font-size:14px;max-width:46ch}
.rm-stats{display:flex;align-items:center;gap:18px;margin-top:16px;position:relative;z-index:1}
.ring{width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--rc) calc(var(--p) * 1%),rgba(255,255,255,.12) 0);display:grid;place-items:center;flex-shrink:0}
.ring span{width:58px;height:58px;border-radius:50%;background:#141417;display:grid;place-items:center;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.count-big b{font-size:42px;line-height:1;letter-spacing:-.04em;display:block;font-variant-numeric:tabular-nums}
.count-big small{color:#B9B8BE;font-size:12px}
.rm-today{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.rm-today h3,.rm-sub{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:750}
.rm-phase-now{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.rm-num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0;background:var(--surface2);color:var(--text)}
.rm-num .i{width:15px;height:15px;stroke-width:3}
.rituals{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.ritual{display:inline-flex;align-items:center;gap:6px;padding:0 12px;min-height:36px;border-radius:999px;border:1.5px dashed color-mix(in srgb,var(--text) 25%,var(--line));font-size:13px;font-weight:600;text-align:left}
.ritual.on{border-style:solid;border-color:var(--rc);background:color-mix(in srgb,var(--rc) 20%,transparent)}
.ritual .i{width:14px;height:14px}
.ritual .muted{font-weight:500}
.step{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.step .cb{margin-top:1px}
.step.done .cb,.ms.done .cb{background:var(--text);border-color:var(--text);color:var(--bg)}
.step.done .st-t{text-decoration:line-through;color:var(--muted)}
.st-t{font-weight:550;line-height:1.3;overflow-wrap:anywhere}
.st-n{font-size:12.5px;color:var(--muted);margin-top:2px}
.st-flag{font-size:10.5px;font-weight:750;color:var(--danger);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.calchip{display:inline-flex;align-items:center;gap:5px;margin-top:7px;font-size:12px;font-weight:600;padding:0 10px;min-height:30px;border-radius:999px;background:var(--surface2)}
.calchip .i{width:13px;height:13px}
.calchip.on{background:color-mix(in srgb,#18A957 15%,transparent);color:#18A957}
.tl-wrap{overflow-x:auto;margin:0 calc(-1 * var(--gx,16px)) 16px;padding:0 var(--gx,16px) 6px;scrollbar-width:none;position:relative}
.tl-wrap::-webkit-scrollbar{display:none}
.tl{display:flex;gap:4px}
.tl-col{flex:var(--w) 1 0;min-width:124px;position:relative}
.tl-marks{height:34px;position:relative}
.tl-ms{position:absolute;top:20px;width:11px;height:11px;margin-left:-5.5px;transform:rotate(45deg);background:var(--rc);border:2px solid var(--bg);box-sizing:content-box}
.tl-ms.done{background:#18A957}
.tl-today{position:absolute;top:0;height:40px;width:2px;margin-left:-1px;background:var(--accent);z-index:2;pointer-events:none}
.tl-today span{position:absolute;top:0;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;letter-spacing:.08em}
.tl-ph{display:block;width:100%;min-height:78px;border-radius:12px;padding:9px 10px 12px;background:color-mix(in srgb,var(--pc) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--pc) 35%,var(--line));position:relative;overflow:hidden;text-align:left}
.tl-ph small{display:block;font-size:10.5px;color:var(--muted);font-weight:600;margin-bottom:3px}
.tl-ph b{display:block;font-size:13px;line-height:1.2}
.tl-ph .fill{position:absolute;left:0;bottom:0;height:4px;background:var(--pc)}
.tl-ph.now{box-shadow:0 0 0 2px var(--text)}
.ph{position:relative;padding-left:42px;margin-bottom:10px;scroll-margin-top:70px}
.ph::before{content:"";position:absolute;left:14px;top:40px;bottom:-12px;width:2px;background:var(--line)}
.ph:last-child::before{display:none}
.ph > .rm-num{position:absolute;left:0;top:12px}
.ph.done > .rm-num{background:#18A957;color:#fff}
.ph.now > .rm-num{background:var(--rc);color:#141417;box-shadow:0 0 0 4px color-mix(in srgb,var(--rc) 28%,transparent)}
.ph.past > .rm-num{background:color-mix(in srgb,var(--danger) 18%,var(--surface2));color:var(--danger)}
.ph-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ph.now .ph-card{border-color:color-mix(in srgb,var(--rc) 65%,var(--line))}
.ph-h{display:flex;align-items:center;gap:10px;width:100%;padding:12px 12px 10px 14px;text-align:left}
.ph-h > div{flex:1;min-width:0}
.ph-h small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.ph-h b{display:block;line-height:1.25;margin-top:1px}
.ph-h > .i{transition:transform .2s;color:var(--muted)}
.ph.open .ph-h > .i{transform:rotate(90deg)}
.ph-bar{height:4px;border-radius:2px;background:var(--surface2);margin:0 14px 12px;overflow:hidden}
.ph-bar span{display:block;height:100%;background:var(--rc);border-radius:2px;transition:width .3s}
.ph-b{padding:0 14px 6px}
.ph-obj{font-size:14px;color:var(--muted);margin:0 0 4px;padding:10px 12px;background:var(--surface2);border-radius:10px}
.ms{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ms .dia{width:11px;height:11px;transform:rotate(45deg);background:var(--rc);flex-shrink:0;margin:0 7px}
.ms.done .dia{background:#18A957}
.habit{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.habit > div{flex:1;min-width:0}
.habit .streak{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.rm-mini{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--rc);border-radius:14px;padding:12px 14px 4px;margin-bottom:8px}
.rm-mini-h{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-bottom:8px}
.rm-mini-h > div:first-child{flex:1;min-width:0}
.rm-mini-h small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.rm-mini-h b{display:block;line-height:1.25}
.rm-days{text-align:center;flex-shrink:0}
.rm-days b{font-size:26px;line-height:1;display:block;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.rm-days small{font-size:11px;color:var(--muted)}
.rm-pick{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.rm-pick > div{flex:1;min-width:0}

.rm-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;min-height:36px}
.rm-bar .muted{font-size:13px}
.rm-hero-edit{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#fff;z-index:2}
.rm.editing .ph-card{border-style:dashed}
.ph-tools{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0 8px}
.ph-tools .btn .i,.rm-bar .btn .i{width:15px;height:15px}
.ms-main{flex:1;min-width:0}
.ms-main[data-act],.st-t[data-act]{cursor:pointer}
.rmtag{font-size:10.5px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--text);color:var(--bg)}
.rmtag.soft{background:var(--surface2);color:var(--muted)}
.task.is-phase{background:color-mix(in srgb,var(--surface2) 60%,var(--surface))}
.task.is-phase .ttl{font-weight:700}

/* ---------- Avisos ---------- */
.note{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px;font-size:14px;color:var(--muted)}
.note b{display:block;color:var(--text);font-size:15px;margin-bottom:2px}
.note.on{border-color:color-mix(in srgb,#18A957 55%,var(--line))}
.ncard{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:10px;overflow:hidden}
.trow{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer}
.trow > div{flex:1;min-width:0}
.switch{appearance:none;-webkit-appearance:none;width:51px;height:31px;min-height:0;padding:0;border-radius:999px;background:var(--surface2);border:0;position:relative;flex-shrink:0;transition:background .2s;cursor:pointer}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.switch:checked{background:#18A957}
.switch:checked::after{transform:translateX(20px)}
.nopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px 14px;border-top:1px solid var(--line)}
.nfield{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.nrow{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.nwhen{font-size:12px;font-weight:700;color:var(--muted);width:96px;flex-shrink:0;padding-top:2px}

#toast{position:fixed;left:50%;bottom:calc(142px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .22s,transform .4s cubic-bezier(.2,1.5,.4,1);z-index:70;white-space:nowrap}

/* ---------- Health ---------- */
.hl-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;background:#141417;color:#F2F1EE;border-radius:18px;padding:18px;margin-top:6px}
.hl-hero .muted{color:#B9B8BE}
.hl-big{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1.05;font-variant-numeric:tabular-nums;margin:2px 0 4px}
.hl-side{display:flex;flex-direction:column;gap:10px;text-align:right;flex-shrink:0}
.hl-delta{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.hl-delta small{display:block;font-size:11.5px;font-weight:600;color:#B9B8BE}
.hl-delta.down{color:#2BD47D} .hl-delta.up{color:#FFC93C}
.hl-custom{display:flex;gap:10px;margin:6px 0 2px}
.hl-custom label{flex:1;display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.hl-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 12px 6px;margin-top:12px}
.hl-card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 2px 6px}
.hl-chart{position:relative;touch-action:pan-y}
.hl-chart svg{display:block;overflow:visible}
.hl-grid{stroke:var(--line);stroke-width:1}
.hl-ax{fill:var(--muted);font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums}
.hl-area{fill:url(#hlFill)}
.hl-line{fill:none;stroke:var(--hl);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0}
:root{--hl-yel:#E0A800}
.hl-goal{stroke:var(--hl-yel);stroke-width:1.5;stroke-dasharray:5 5}
.hl-goal-t{fill:var(--hl-yel);font-size:10.5px;font-weight:700;paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.hl-cur line{stroke:var(--text);stroke-width:1;stroke-dasharray:3 3;opacity:.5}
.hl-cur circle{fill:#2BB673;stroke:#2BB673;stroke-width:1.5}
.hl-tip{position:absolute;transform:translate(-50%,calc(-100% - 9px));background:var(--text);color:var(--bg);border-radius:7px;padding:3px 7px;text-align:center;pointer-events:none;opacity:0;transition:opacity .15s;white-space:nowrap;z-index:2;line-height:1.25}
.hl-tip.below{transform:translate(-50%,9px)}
.hl-tip.show{opacity:.94}
.hl-tip b{font-size:12.5px}
.hl-tip small{font-size:10px;opacity:.75}
.hl-tip .exp{display:block;font-size:10.5px;font-weight:700;color:#FFC93C}
@media (prefers-color-scheme: dark){.hl-tip .exp{color:#8A6400}}
.enter .hl-line{animation:draw 1.3s cubic-bezier(.4,0,.2,1) both}
.enter .hl-area{animation:fade .9s .5s both}
@keyframes draw{from{stroke-dashoffset:1}}
.hl-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.hl-stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 8px;min-width:0}
.hl-stats small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.hl-stats b{display:block;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){ .hl-stats{grid-template-columns:repeat(2,1fr)} }
b.down,.hl-d.down{color:#18A957} b.up,.hl-d.up{color:#D19A00} /* subir de peso: amarillo, no rojo */
.hl-list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.hl-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 14px;border-top:1px solid var(--line)}
.hl-row:first-child{border-top:0}
.hl-row > div{flex:1;min-width:0}
.hl-row small{display:block;font-size:12px;color:var(--muted)}
.hl-d{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.hl-kg{font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
.hl-steps{padding-left:20px;margin:0 0 12px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.hl-copy{display:flex;align-items:center;gap:8px;margin-top:6px;background:var(--surface2);border-radius:10px;padding:6px 6px 6px 10px}
.hl-copy code{flex:1;min-width:0;overflow-wrap:anywhere;font-size:12.5px}
code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
/* Macros */
.hl-band{fill:var(--bc);opacity:.17}
.hl-band-edge{stroke:var(--bc);stroke-width:1.5;opacity:.55}
.hl-band-t{fill:var(--bc);font-size:10.5px;font-weight:800}
.enter .hl-band{animation:fade .6s both}
.mc-toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:650;color:var(--muted);margin:0 2px 6px;min-height:32px}
.mc-sw{width:34px;height:20px;border-radius:999px;background:var(--surface2);position:relative;transition:background .2s}
.mc-sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s cubic-bezier(.2,1.4,.4,1)}
.mc-toggle.on{color:var(--text)} .mc-toggle.on .mc-sw{background:#18A957} .mc-toggle.on .mc-sw::after{transform:translateX(14px)}
.mc-legend{display:flex;flex-direction:column;gap:5px;padding:6px 4px 8px;font-size:12.5px;font-weight:650}
.mc-legend span{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mc-legend i{width:12px;height:12px;border-radius:3px;background:color-mix(in srgb,var(--bc) 35%,transparent);box-shadow:inset 0 0 0 1.5px var(--bc);flex-shrink:0}
.mc-legend em{font-style:normal;font-weight:500;color:var(--muted)}
.mc-hero{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--bc);border-radius:18px;padding:16px;margin-top:6px}
.mc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mc-hero .hl-big small{font-size:18px;font-weight:700;color:var(--muted);letter-spacing:0}
.mc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 10px}
.mc-grid div{background:var(--surface2);border-radius:12px;padding:8px 10px}
.mc-grid i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.mc-grid b{font-size:17px;font-variant-numeric:tabular-nums}
.mc-grid small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.mc-bar{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:2px;background:var(--surface2)}
.mc-bar span{display:block;min-width:4px}
.enter .mc-bar{animation:mcGrow .8s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}
@keyframes mcGrow{from{transform:scaleX(0)}}
.mc-row .mc-dot{width:12px;height:12px;border-radius:4px;background:var(--bc);flex-shrink:0}
.hl-subrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 8px}
.hl-subrow .rm-sub{margin:0}
.hl-subrow .btn .i{width:15px;height:15px}
.hl-entry{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.hl-entry > div{flex:1;min-width:0}
.hl-entry small{display:block;font-size:12px;color:var(--muted)}
.hl-entry .i{width:18px;height:18px;color:var(--muted);flex-shrink:0}
.mc-auto{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:10px}
.mc-auto div{background:var(--surface2);border-radius:12px;padding:8px 10px;min-width:0}
.mc-auto small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.mc-auto b{font-size:14.5px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.finfo-v{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:14px;min-height:42px}
.finfo-v b{font-size:16px;font-variant-numeric:tabular-nums}
.finfo-v small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
/* Ritmo de peso y progreso esperado */
.hl-rate{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-top:10px}
.hl-rate > div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 10px;min-width:0}
.hl-rate small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.hl-rate b{display:block;font-size:16px;font-variant-numeric:tabular-nums;margin:1px 0;line-height:1.25}
.hl-rate b.ok{color:#18A957} .hl-rate b.off{color:#D97706}
.hl-tools{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.hl-tools .mc-toggle{justify-content:space-between;flex-direction:row-reverse;width:100%;padding:8px 2px;margin:0;font-size:15px;border-top:1px solid var(--line)}
.hl-tools .mc-toggle:first-child{border-top:0}
.hl-tools .mc-toggle span:last-child{display:flex;flex-direction:column;text-align:left}
.hl-tools .mc-toggle small{font-size:12px;font-weight:500;color:var(--muted)}
.hl-tools-btn{display:inline-flex;align-items:center;gap:5px}
.hl-tools-btn b{background:#18A957;color:#fff;border-radius:999px;font-size:10.5px;min-width:17px;height:17px;padding:0 5px;display:inline-grid;place-items:center}
.hl-exp{stroke:var(--hl-yel);stroke-width:2;stroke-dasharray:6 5;stroke-linecap:round}
.hl-exp-band{fill:var(--hl-yel);opacity:.13}
.hl-exp-0{fill:var(--hl-yel);stroke:var(--surface);stroke-width:2}
.hl-exp-t{fill:var(--hl-yel);font-size:10.5px;font-weight:700}
.mc-legend.row{flex-direction:row;flex-wrap:wrap;gap:4px 12px;padding:6px 4px 8px;font-size:12px}
.mc-legend.row span{gap:5px;flex-wrap:nowrap;font-variant-numeric:tabular-nums}
.mc-legend .hl-exp-l i{background:none;box-shadow:none;border-top:2px dashed var(--hl-yel);border-radius:0;height:0;width:14px}
.enter .hl-exp,.enter .hl-exp-band{animation:fade .8s .6s both}
/* Pasos */
.st-bar{fill:#9CC3EE;transition:opacity .15s}
.st-bar.hi{fill:#2F6FD6}
.st-avg{stroke:var(--text);stroke-width:1.5;stroke-dasharray:5 5;opacity:.7}
.st-avg-t{fill:var(--text);font-size:10.5px;font-weight:700}
.st-avg-t,.hl-exp-t{paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.enter .st-bar{animation:hmIn .35s calc(.2s + var(--i) * 8ms) both;transform-box:fill-box;transform-origin:bottom}
.st-hero .hl-big small{font-size:18px;font-weight:700;color:#B9B8BE;letter-spacing:0}
.st-guide{margin-top:10px}
.st-guide summary{cursor:pointer;font-weight:700;font-size:13.5px}
.st-guide .hl-steps{margin-top:10px}
.st-guide code{background:var(--surface2);padding:1px 5px;border-radius:5px}
.mc-row small + small{margin-top:1px}
.mc-row{padding:9px 14px}
.mc-row small{font-size:11.5px;font-variant-numeric:tabular-nums}
.mc-30{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0;font-variant-numeric:tabular-nums}
.mc-30 b{font-size:15px}
.mc-30 small{font-size:10.5px;color:var(--muted)}

/* Configuración → Barra */
.navcfg{display:flex;align-items:center;gap:6px;padding:8px 10px 8px 14px;border-top:1px solid var(--line)}
.navcfg:first-child{border-top:0}
.navcfg b{flex:1;min-width:0}
.navcfg-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--surface2);margin-right:4px}
.navcfg.off b,.navcfg.off .navcfg-ic{opacity:.45}
.navcfg .icon-btn:disabled{opacity:.25;pointer-events:none}
.navcfg .switch{margin-left:6px}
@media (max-width:440px){ .set-tabs button:not(.on) span{display:none} }
/* Cuenta, compartido y estado de la sincronización */
.acc-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.acc-card h3{font-size:15px;margin:0 0 4px}
.acc-top{display:flex;align-items:center;gap:12px}
.acc-top .avatar{background:var(--text);color:var(--bg)}
.chkrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chkrow label{display:inline-flex;align-items:center;gap:6px;padding:0 12px;min-height:36px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;font-weight:600;cursor:pointer}
.chkrow input{width:18px;height:18px;min-height:0;accent-color:var(--text)}
.chkrow label.dis{opacity:.45;pointer-events:none}
.keybox{display:flex;align-items:center;gap:8px;margin-top:10px;background:var(--surface2);border-radius:10px;padding:8px 8px 8px 12px}
.keybox code{flex:1;min-width:0;overflow-wrap:anywhere;font-size:12.5px}
.u-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-top:1px solid var(--line)}
.u-row:first-child{border-top:0}
.u-row > div{flex:1;min-width:0}
.u-row small{display:block;color:var(--muted);font-size:12px}
.badge{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.badge.ok{background:color-mix(in srgb,#18A957 16%,transparent);color:#18A957}
.badge.adm{background:var(--text);color:var(--bg)}
.inv{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.inv:first-child{border-top:0}
.inv code{font-size:16px;font-weight:800;letter-spacing:.08em;white-space:nowrap}
.inv .muted{flex:1;min-width:0}
.um-sec{margin-top:16px}
.um-sec h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.um-spark{width:100%;height:90px;display:block}
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#18A957;margin-right:6px;vertical-align:1px}
.sync-dot.dirty{background:#F5C518}
.sync-dot.off{background:var(--danger)}

/* ---------- Animaciones e interacción ---------- */
@property --p{syntax:'<number>';inherits:true;initial-value:0}
/* respuesta al pulsar: todo lo que se toca se hunde un poco */
.btn,.icon-btn,.nav,.pill,.pchip,.cb,.ritual,.set-tabs button,.seg button,.dv-switch button,.side-gear,.calchip,.st-date,.group-h .add,.tact button,.tw,.sw span,.daypick span,.hb-dot,.rm-hero-edit,.cgrid .sq span{
  transition:transform .16s cubic-bezier(.2,.8,.2,1),background-color .2s,color .2s,border-color .2s,box-shadow .2s,opacity .2s}
.btn:active,.icon-btn:active,.pill:active,.pchip:active,.cb:active,.ritual:active,.set-tabs button:active,.seg button:active,.dv-switch button:active,.side-gear:active,.calchip:active,.st-date:active,.group-h .add:active,.tact button:active,.tw:active,.sw:active span,.daypick label:active span,.hb-dot:active,.rm-hero-edit:active,.cgrid .sq:active span{transform:scale(.92)}
.nav:active{transform:scale(.97)}
.crow,.cell,.task,.tl-ph,.ph-h,.cm-opt,.rm-mini-h,.dt-h,.dv-ev,.dv-chip,.lib-card,.pcard,.trow{transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .2s,border-color .2s,background-color .2s}
.crow:active,.cell:active,.task:active,.tl-ph:active,.cm-opt:active,.rm-mini-h:active,.dv-ev:active,.dv-chip:active,.trow:active{transform:scale(.98)}
.ph-h:active,.dt-h:active{opacity:.7}
.fab{transition:transform .25s cubic-bezier(.2,1.6,.4,1),box-shadow .25s}
.fab:active{transform:scale(.88) rotate(90deg)}
@media (hover:hover) and (pointer:fine){
  .btn:hover{filter:brightness(1.12)}
  .btn.ghost:hover{filter:none;background:color-mix(in srgb,var(--text) 12%,var(--surface2))}
  .crow:hover,.lib-card:hover,.pcard:hover,.hb-hist:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.08)}
  .cell:not(.blank):hover{border-color:color-mix(in srgb,var(--text) 22%,transparent)}

body.nav-open #scrim{animation:fade .25s}

.sheet-ghost{position:fixed;inset:0;z-index:61;pointer-events:none}

const TODAY = () => iso(new Date());

const PLATFORMS = ['Instagram', 'TikTok', 'YouTube', 'LinkedIn', 'X', 'Otro'];

/* Cuadrícula de «Más colores»: 12 tonos en columnas, de claro a oscuro en filas, y una fila de grises */
const COLOR_GRID = (() => {
  const hex = (h, s, l) => {
    s /= 100; l /= 100;
    const f = n => { const k = (n + h / 30) % 12, c = l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1)); return Math.round(c * 255).toString(16).padStart(2, '0'); };
    return ('#' + f(0) + f(8) + f(4)).toUpperCase();
  };
  const hues = [0, 18, 32, 46, 75, 125, 160, 185, 205, 228, 265, 310];
  const rows = [[85, 84], [80, 72], [78, 60], [75, 50], [70, 40], [60, 30]];
  const out = [];
  rows.forEach(([s, l]) => hues.forEach(h => out.push(hex(h, s, l))));
  for (let i = 0; i < 12; i++) out.push(hex(0, 0, Math.round(95 - i * 7.5)));
  return out;
})();

const newDevice = () => ({id:randStr(24), token:randStr(40)});
function ensureDefaults(d){
  d.ui = Object.assign(defaultUI(), d.ui || {});
  const n = d.notif || {}, def = defaultNotif();
  d.notif = {enabled:!!n.enabled, pub:{...def.pub, ...n.pub}, daily:{...def.daily, ...n.daily}, tasks:{...def.tasks, ...n.tasks}};
  if (!d.device || !d.device.id) d.device = newDevice();
  // Calendario de Nextcloud (CalDAV): qué se ve, cuál es el de Pizarra y qué se lleva a él (lo usa la app Android)
  d.calendario = Object.assign({activo:true}, d.calendario || {});
  d.calendario.vincular = Object.assign({publicaciones:true, tareas:true, hitos:true}, d.calendario.vincular || {});
  if (!Array.isArray(d.habitArchive)) d.habitArchive = []; // hábitos de hojas que ya no están en uso, con su histórico
  // Barra lateral configurable: orden y apartados visibles (Configuración → Barra)
  const navCfg = Array.isArray(d.navCfg) ? d.navCfg.filter(x => NAV_DEFS[x.k]) : [];
  Object.keys(NAV_DEFS).forEach(k => { if (!navCfg.some(x => x.k === k)) navCfg.push({k, on:true}); });
  d.navCfg = navCfg;
  // Health: pesos (kg) por momento ISO. src: 'renpho' (llega solo) o 'manual'
  // rateMin/rateMax: ritmo objetivo en % al mes (p. ej. 0.8 y 1.2); expected = línea de progreso esperado en la gráfica
  // steps: pasos de cada día [{d:'AAAA-MM-DD', n, src:'hc'|'salud'|'manual'}], con su propio intervalo (stepsRange…)
  d.health = Object.assign({weight:[], goal:'', rateMin:'', rateMax:'', expected:false, range:'30', mode:'dia', from:'', to:'',
    stepsRange:'30', stepsFrom:'', stepsTo:'', syncAt:0}, d.health || {});
  if (!Array.isArray(d.health.steps)) d.health.steps = [];
  // Macros: cada cambio rige desde su fecha hasta el siguiente. bands = fondo de color por macros en la gráfica
  if (!Array.isArray(d.health.macros)) d.health.macros = [];
  if (!d.health.tab) d.health.tab = 'metricas';
  if (!Array.isArray(d.library)){ // Mis hojas: empieza con las hojas que ya usan los proyectos
    d.library = (d.projects || []).filter(p => p.roadmap).map(p => ({id:p.roadmap.data.id, title:p.roadmap.data.title, data:JSON.parse(JSON.stringify(p.roadmap.data)), updated:Date.now()}));
  }
  if (!d.colorSync && Array.isArray(d.profiles) && Array.isArray(d.projects)){

}

/* =========================================================
   Almacenamiento y sincronización
   · En la app Android (lo normal): los datos viven en la base de datos de la app, que los sincroniza sola con el

     la web lee y escribe a través del puente window.PizarraAndroid. El reparto en entidades está en modelo.js.
   · En un navegador del ordenador (vista previa): se guarda en este navegador; datos/pizarra-local.html trae

   ========================================================= */
const AND = window.PizarraAndroid || null;
function andCall(fn, ...a){ try { return AND && typeof AND[fn] === 'function' ? AND[fn](...a) : null; } catch (e) { return null; } }
const andJSON = (fn, ...a) => { try { return JSON.parse(andCall(fn, ...a) || 'null'); } catch (e) { return null; } };
const NC = !!(AND && typeof AND.loadEntities === 'function' && window.PizarraModelo);
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
let ncPrev = new Map();   // huella de cada entidad tal como la tiene la web (para mandar solo lo que cambia)
let ncReady = false;      // hasta la primera sincronización de un móvil nuevo no se guarda nada (para no pisar con datos vacíos)
let ncPending = false;    // llegaron datos nuevos con una ficha abierta: se cargan al cerrarla

function load(){
  // Vista previa local generada con tus datos reales (datos/pizarra-local.html): manda la copia, no el navegador
  if (window.__PIZARRA_DATA__){ S = ensureDefaults(JSON.parse(JSON.stringify(window.__PIZARRA_DATA__))); return; }
  if (NC){ ncLoad(); return; }
  try {
    const raw = localStorage.getItem(KEY) || localStorage.getItem(OLD_KEY);

function ncLoad(){
  const lista = andJSON('loadEntities') || [];
  ncPrev = new Map(lista.map(e => [e.tipo + '/' + e.id, JSON.stringify(e.datos)])); // antes de completar valores por defecto
  let loc = {}; try { loc = JSON.parse(lsGet('pizarra.local') || '{}'); } catch (e) {}
  const st = andJSON('syncState') || {};
  ncReady = lista.length > 0 || st.at > 0;
  S = ensureDefaults({...(lista.length ? PizarraModelo.ensamblar(lista) : blankData()), ui:loc.ui, device:loc.device});
}
/** Manda a la app solo las entidades que han cambiado, con la versión de la que partían (para fusionar si hace falta). */
function ncSave(){
  if (!ncReady) return;
  const cur = PizarraModelo.trocear(S), put = [], del = [], next = new Map();
  for (const [k, v] of cur){
    const s = JSON.stringify(v), p = ncPrev.get(k); next.set(k, s);
    if (p !== s) put.push({k, datos:v, base:p == null ? null : JSON.parse(p)});
  }
  for (const [k, p] of ncPrev) if (!next.has(k)) del.push({k, base:JSON.parse(p)});
  if (!put.length && !del.length) return;
  ncPrev = next;
  const r = andJSON('applyChanges', JSON.stringify({put, del}));
  if (r && r.recargar) setTimeout(ncAdopt, 0); // otro dispositivo había cambiado lo mismo: se carga lo fusionado
}
function ncAdopt(){
  if ($('#sheet').classList.contains('open')){ ncPending = true; return; }
  ncPending = false; ncLoad(); render();
}

/* Buzón: lo que Claude deja desde el ordenador en Nextcloud (Pizarra/buzon) se aplica solo al abrir la app */
function checkInbox(){
  if (!NC) return;
  const items = andJSON('inboxGet') || [];
  if (!items.length) return;
  const done = [], names = [];
  items.sort((a, b) => (a.at || 0) - (b.at || 0)).forEach(it => {
    try { if (it.type === 'roadmap'){ applyFromClaude(it); names.push(it.data.title || 'hoja'); } } catch (e) {}
    done.push(it.iid); // aunque falle una, no se repite en bucle
  });
  render();
  andCall('inboxAck', JSON.stringify(done));
  if (names.length) toast(`Claude ha actualizado: ${names.join(', ')}`);
}
function applyFromClaude(it){
  const d = parseRoadmapText(JSON.stringify(it.data));
  const old = S.library.find(x => x.id === d.id);
  saveToLibrary(d);
  const entry = S.library.find(x => x.id === d.id);
  if (old) entry.prev = old.data; else delete entry.prev; // para «Deshacer» la actualización
  delete entry.replaced;
  entry.byClaude = Date.now();
  // la hoja se actualiza en todos los proyectos que la usan (conservando lo marcado), y en el indicado si viene
  S.projects.filter(p => p.roadmap && p.roadmap.src.id === d.id).forEach(p => applyRoadmapData(p.id, d, {fromClaude:true}));
  if (it.pid && project(it.pid) && !(project(it.pid).roadmap && project(it.pid).roadmap.src.id === d.id)){
    const p = project(it.pid);
    if (p.roadmap) entry.replaced = {pid:p.id, data:clone(p.roadmap.data)};
    applyRoadmapData(p.id, d, {fromClaude:true});
  }
}

const prof = id => S.profiles.find(p => p.id === id);
const pColor = id => (prof(id) || {}).color || '#8A8A93';

const profOn = id => !S.ui.sel.length || S.ui.sel.includes(id);
const visible = c => profOn(c.profileId);
const task = id => S.tasks.find(t => t.id === id);
const project = id => S.projects.find(p => p.id === id);
const projVisible = pid => { const p = project(pid); return !p || profOn(p.profileId); };
const children = (pid, parent) => S.tasks.filter(t => t.projectId === pid && (t.parentId || '') === (parent || '')).sort((a, b) => a.order - b.order);
const nextOrder = (pid, parent) => Math.max(0, ...children(pid, parent).map(t => t.order)) + 1;
function descendants(id){ const out = []; S.tasks.filter(t => t.parentId === id).forEach(t => out.push(t.id, ...descendants(t.id))); return out; }
function treeFlat(pid, parent = '', depth = 0, out = []){ children(pid, parent).forEach(t => { out.push({t, depth}); treeFlat(pid, t.id, depth + 1, out); }); return out; }
function progress(pid){ const l = S.tasks.filter(t => t.projectId === pid); return {done:l.filter(t => t.done).length, total:l.length}; }
const initials = n => n.trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();
const byDate = (a, b) => (a.date || '9999').localeCompare(b.date || '9999') || (a.time || '99').localeCompare(b.time || '99');
function fmtShort(s){
  if (s === TODAY()) return 'Hoy';
  if (s === iso(addDays(new Date(), 1))) return 'Mañana';
  if (s === iso(addDays(new Date(), -1))) return 'Ayer';
  return parseISO(s).toLocaleDateString('es-ES', {weekday:'short', day:'numeric', month:'short'});
}
const fmtLong = s => parseISO(s).toLocaleDateString('es-ES', {weekday:'long', day:'numeric', month:'long'});
const empty = (t, s) => `<div class="empty"><b>${t}</b>${s || ''}</div>`;
const profileOpts = () => [{v:'', l:'Sin perfil'}, ...S.profiles.map(p => ({v:p.id, l:p.name}))];

function moveTask(id, dir){
  const t = task(id); const sib = children(t.projectId, t.parentId || '');
  sib.forEach((s, i) => s.order = i);
  const i = sib.indexOf(t), j = i + dir;
  if (j < 0 || j >= sib.length) return;
  [sib[i].order, sib[j].order] = [sib[j].order, sib[i].order];
}

/* Todo lo que aparece en el calendario, agrupado por día:
   publicaciones (c), pasos de hojas de ruta (s) e hitos (m) */
function calIndex(){
  const byDay = {}, add = (k, it) => { if (k) (byDay[k] = byDay[k] || []).push(it); };
  const rmPub = {}; // publicación creada desde un paso → color del proyecto
  S.projects.forEach(p => p.roadmap && Object.values(p.roadmap.cal || {}).forEach(cid => { rmPub[cid] = rmColor(p); }));
  S.contents.filter(visible).forEach(c => add(c.date, {kind:'c', c, color:rmPub[c.id] || pColor(c.profileId), title:c.title, time:c.time || '', end:c.end || '', done:c.status === 'publicado'}));
  S.projects.filter(p => p.roadmap && projVisible(p.id)).forEach(p => {
    const R = p.roadmap, dates = stepDates(p), color = rmColor(p);
    R.data.phases.forEach(ph => {
      ph.steps.forEach(s => {
        const cid = (R.cal || {})[s.id];
        if (cid && S.contents.some(c => c.id === cid)) return; // ya está como publicación
        add(dates[s.id], {kind:'s', p, s, color, title:s.title, time:stepTime(p, s), end:stepEnd(p, s), done:!!R.done[s.id]});
      });
      (ph.milestones || []).forEach(m => add(m.date, {kind:'m', p, m, ph, color, title:m.title, time:msTime(p, m), end:msEnd(p, m), done:!!R.done[m.id]}));
    });
  });
  // eventos de tus calendarios de Nextcloud (reuniones, citas…): los da la app desde su copia local, ya con las repeticiones
  calEventos().forEach(ev => {
    const it = {kind:'e', ev, color:ev.color, title:ev.titulo, time:ev.hora || '', end:ev.fecha === ev.fechaFin ? ev.horaFin || '' : '', done:!!ev.hecha};
    if (ev.todoElDia && ev.fechaFin > ev.fecha){ for (let d = parseISO(ev.fecha); iso(d) <= ev.fechaFin; d = addDays(d, 1)) add(iso(d), it); }
    else add(ev.fecha, it);
  });
  const rank = {c:0, e:1, m:2, s:3};
  Object.values(byDay).forEach(l => l.sort((a, b) => rank[a.kind] - rank[b.kind] || (a.time || '99').localeCompare(b.time || '99')));
  return byDay;
}

/* ---------- Ritmo de peso: % de los últimos 30 días y progreso esperado ---------- */
const numES = v => { const n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isNaN(n) ? null : n; };
const fmtPct = (n, dec = 1) => (n > 0 ? '+' : n < 0 ? '−' : '±') + Math.abs(n).toLocaleString('es-ES', {minimumFractionDigits:dec, maximumFractionDigits:dec}) + ' %';
function dayWeights(){ // un valor por día (media si hubo varias pesadas)
  const g = new Map(); weights().forEach(w => { const d = w.t.slice(0, 10); (g.get(d) || g.set(d, []).get(d)).push(w.kg); });
  return [...g.entries()].sort((x, y) => x[0].localeCompare(y[0])).map(([d, l]) => ({d, kg:l.reduce((s, v) => s + v, 0) / l.length}));
}
function rateTarget(){ // ritmo objetivo en % al mes: {min, max, mid}
  let lo = numES(S.health.rateMin), hi = numES(S.health.rateMax);
  if (lo == null && hi == null) return null;
  if (lo == null) lo = hi; if (hi == null) hi = lo; if (lo > hi) [lo, hi] = [hi, lo];
  return {min:lo, max:hi, mid:(lo + hi) / 2};
}
function weight30(){ // del peso de hace 30 días (o el día con pesada más cercano) a la última pesada
  const ds = dayWeights(); if (ds.length < 2) return null;
  const start = iso(addDays(new Date(), -30)), last = ds[ds.length - 1];
  const cand = ds.filter(p => p.d >= iso(addDays(parseISO(start), -7)) && p.d < last.d);
  if (!cand.length) return null;
  const p0 = cand.reduce((x, p) => Math.abs(daysBetween(p.d, start)) < Math.abs(daysBetween(x.d, start)) ? p : x);
  const days = Math.max(1, daysBetween(p0.d, last.d)), pct = (last.kg - p0.kg) / p0.kg * 100;
  return {p0, p1:last, days, kg:last.kg - p0.kg, pct, month:pct * 30 / days};

  const r = rateTarget(), w = weight30(); if (!r || !w) return null;
  return {r, d0:w.p0.d, kg0:w.p0.kg, at:(rate, d) => w.p0.kg * (1 + rate / 100 * daysBetween(w.p0.d, d) / 30)};

const rateTxt = r => Math.abs(r.min - r.max) < 1e-9 ? fmtPct(r.min) : `${fmtPct(r.min).replace(' %', '')} a ${fmtPct(r.max)}`;

  const w = weight30(), r = rateTarget(), ex = expectedFrom();
  if (!w && !r) return '';

  return `<div class="hl-rate">
    <div><small>Últimos 30 días</small><b class="${st ? st[0] : ''}">${w ? fmtPct(w.pct, 2) : '–'}</b><small>${w ? `${fmtDiff(w.kg)} · desde el ${fmtShort(w.p0.d)}${w.days !== 30 ? ` (${w.days} días)` : ''}` : 'Faltan pesadas'}</small></div>
    <div><small>Ritmo objetivo</small><b>${r ? rateTxt(r) : '–'}</b><small>${r ? (st ? st[1] : 'al mes') : `<button class="btn ghost sm" data-act="healthGoal" style="margin-top:4px">Fijar ritmo</button>`}</small></div>
    ${ex ? `<div><small>Esperado hoy</small><b>${fmtKg(ex.at(ex.r.mid, TODAY()))}</b><small>${Math.abs(ex.r.min - ex.r.max) < 1e-9 ? 'al ritmo objetivo' : `${fmtKg(ex.at(ex.r.min, TODAY()))} – ${fmtKg(ex.at(ex.r.max, TODAY()))}`}</small></div>` : ''}

/* ---------- Macros: cambios de kcal, CH, P y G a lo largo del tiempo ---------- */
const fmtNum = n => Number(n).toLocaleString('es-ES', {maximumFractionDigits:0});

/* Mezcla pesadas nuevas sin duplicar (misma fecha y minuto = la misma pesada) */
function mergeWeights(items, src){
  const map = new Map(S.health.weight.map(w => [w.t, w])); let added = 0;
  items.forEach(it => {
    const kg = Math.round(Number(it.kg) * 100) / 100; if (!(kg > 20 && kg < 400) || !/^\d{4}-\d\d-\d\dT\d\d:\d\d$/.test(it.t)) return;
    const old = map.get(it.t);
    if (!old) added++;
    map.set(it.t, Object.assign({}, old, {t:it.t, kg, src:old && old.src === 'manual' && src !== 'manual' ? 'manual' : src}, it.fat ? {fat:Math.round(it.fat * 10) / 10} : {}));
  });
  S.health.weight = [...map.values()].sort((x, y) => x.t.localeCompare(y.t));
  return added;
}

/* CSV exportado desde RENPHO (o cualquier tabla con fecha y peso) */
function parseWeightCSV(txt){
  const lines = txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean); if (!lines.length) return [];
  const sep = [';', ',', '\t'].sort((x, y) => lines[0].split(y).length - lines[0].split(x).length)[0];
  const split = l => l.split(sep).map(c => c.replace(/^"|"$/g, '').trim());
  const head = split(lines[0]).map(h => h.toLowerCase());
  let di = head.findIndex(h => /fecha|date|time|hora/.test(h)), wi = head.findIndex(h => /peso|weight/.test(h)), fi = head.findIndex(h => /grasa|fat/.test(h));
  const hi = head.findIndex((h, i) => i !== di && /^(hora|time)$/.test(h));
  const rows = di >= 0 && wi >= 0 ? lines.slice(1) : lines; if (di < 0) di = 0; if (wi < 0) wi = 1;
  return rows.map(l => {
    const c = split(l); let ds = c[di] + (hi >= 0 ? ' ' + c[hi] : ''), kg = parseFloat((c[wi] || '').replace(',', '.').replace(/[^\d.]/g, ''));
    let m = ds.match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})(?:[ T,]+(\d{1,2}):(\d{2}))?/), d;
    if (m) d = new Date(+m[1], m[2] - 1, +m[3], +(m[4] || 8), +(m[5] || 0));
    else if ((m = ds.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})(?:[ T,]+(\d{1,2}):(\d{2}))?/))) d = new Date(+(m[3].length === 2 ? '20' + m[3] : m[3]), m[2] - 1, +m[1], +(m[4] || 8), +(m[5] || 0));
    if (!d || isNaN(d) || isNaN(kg)) return null;
    if (/lb/i.test(head[wi] || '')) kg *= 0.45359237;
    const fat = fi >= 0 ? parseFloat((c[fi] || '').replace(',', '.')) : NaN;
    return {t:localStamp(d), kg, fat:isNaN(fat) ? undefined : fat};
  }).filter(Boolean);
}
