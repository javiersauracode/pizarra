/* ---------- Hoja de ruta ----------
   Las hojas las diseña Claude y se publican en /hojas (index.json + un .json por hoja).
   En el proyecto se guarda: src (id + versión), data (la hoja), done (pasos/hitos marcados),
   rituals (días en que se cumplió cada hábito) y cal (paso → publicación del calendario). */
let rmIndex = [];
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 864e5);
const shortDate = s => parseISO(s).toLocaleDateString('es-ES', {day:'numeric', month:'short'}).replace('.', '');
const shortRange = (a, b) => `${shortDate(a)} – ${shortDate(b)}`;
const DAY_NAMES = ['Domingos', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábados'];
const DAY_SHORT = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];
const freqLabel = days => !days || !days.length ? 'Cada día' : days.length === 1 ? DAY_NAMES[days[0]] : days.map(d => DAY_SHORT[d]).join(' · ');
/* La hoja de ruta usa siempre el color del proyecto */
const rmColor = p => p.color || (p.roadmap && p.roadmap.data.color) || '#8A8A93';
const scheduled = (r, d) => !r.days || !r.days.length || r.days.includes(d.getDay());
const phaseItems = ph => [...ph.steps, ...(ph.milestones || [])];

/* Catálogo de hojas publicadas por Claude: la carpeta Pizarra/hojas de tu Nextcloud (la app la sincroniza) */
async function loadRmIndex(){
  rmIndex = NC ? (andJSON('rmIndex') || []) : [];
  return rmIndex;
}
async function applyRoadmap(pid, file){
  let data = NC ? andJSON('rmGet', file) : null;
  if (!data) throw new Error('hoja');
  if (data.roadmap && data.roadmap.phases) data = data.roadmap;
  saveToLibrary(data);
  return applyRoadmapData(pid, data);
}
/* Pone una hoja en un proyecto. Si es la misma hoja (mismo id), conserva lo marcado, las fechas y horas cambiadas y los enlaces */
function applyRoadmapData(pid, src, extra = {}){
  const data = JSON.parse(JSON.stringify(src));
  const p = project(pid), prev = p.roadmap, keep = !!(prev && prev.src.id === data.id);
  if (prev && !keep) archiveHabits(p, prev); // al cambiar de hoja, el histórico de hábitos no se pierde
  const done = keep ? {...prev.done} : {};
  data.phases.forEach(ph => phaseItems(ph).forEach(i => { if (i.done && !(i.id in done)) done[i.id] = true; }));
  p.roadmap = {src:{id:data.id, version:data.version || 0, ...extra}, data, done, rituals:keep ? prev.rituals : {}, cal:keep ? (prev.cal || {}) : {}, dates:keep ? (prev.dates || {}) : {}, times:keep ? (prev.times || {}) : {}, ends:keep ? (prev.ends || {}) : {}};
  S.ui.mode = 'ruta';
  return {data, keep};
}
/* Igual, pero preguntando antes de sustituir cambios o una hoja distinta. Devuelve false si se cancela */
function applyRoadmapAsk(pid, data, extra){
  const p = project(pid), cur = p.roadmap;
  if (cur && cur.src.id === data.id && cur.edited && !confirm(`Vas a actualizar «${cur.data.title}». Sustituye los cambios hechos en la app (lo marcado como hecho se mantiene). ¿Seguir?`)) return false;
  if (cur && cur.src.id !== data.id && !confirm(`¿Sustituir «${cur.data.title}» por «${data.title}» en ${p.name}? Se perderá lo marcado en la hoja actual (sigue guardada en Mis hojas).`)) return false;
  const {keep} = applyRoadmapData(pid, data, extra);
  const sug = data.project;
  if (!keep && sug && sug.name && sug.name !== p.name && confirm(`¿Renombrar el proyecto «${p.name}» a «${sug.name}»?`)){ p.name = sug.name; if (sug.desc) p.desc = sug.desc; }
  return true;
}

/* ---------- Mis hojas: biblioteca de hojas de ruta guardadas en la app ---------- */
const clone = o => JSON.parse(JSON.stringify(o));
function saveToLibrary(data){
  if (!data || !data.id) return;
  const d = clone(data); delete d.progreso;
  const i = S.library.findIndex(x => x.id === d.id), old = S.library[i] || {};
  const entry = {id:d.id, title:d.title || 'Hoja de ruta', data:d, updated:Date.now(),
    ...(old.byClaude ? {byClaude:old.byClaude, prev:old.prev, replaced:old.replaced} : {})}; // conserva el «Deshacer» de Claude
  if (i >= 0) S.library[i] = entry; else S.library.unshift(entry);
}
/* Lee una hoja desde un texto o archivo (JSON tal cual, dentro de ```json ...```, o la copia de «Copiar para Claude») */
function parseRoadmapText(txt){
  let s = String(txt || '').trim();
  const fence = s.match(/```(?:json)?\s*([\s\S]*?)```/i); if (fence) s = fence[1].trim();
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a < 0) throw new Error('No encuentro una hoja de ruta en el texto.');
  if (b < a) throw new Error('El texto está incompleto. Cópialo entero, desde la primera { hasta la última }.');
  let d;
  try { d = JSON.parse(s.slice(a, b + 1)); } catch (e) { throw new Error('El texto está incompleto o mal copiado. Cópialo entero, desde la primera { hasta la última }.'); }
  if (d.roadmap && d.roadmap.phases) d = d.roadmap; else if (d.data && d.data.phases) d = d.data;
  if (!Array.isArray(d.phases) || !d.phases.length) throw new Error('A la hoja le faltan las fases.');
  delete d.progreso;
  d.id = String(d.id || 'imp-' + uid()); d.version = Number(d.version) || 0; d.title = d.title || 'Hoja de ruta';
  d.rituals = (Array.isArray(d.rituals) ? d.rituals : []).map(r => ({...r, id:r.id || 'h' + uid(), days:Array.isArray(r.days) ? r.days : []}));
  d.phases.forEach((ph, i) => {
    ph.id = ph.id || 'f' + uid(); ph.name = ph.name || `Fase ${i + 1}`;
    if (!ph.start || !ph.end) throw new Error(`La fase «${ph.name}» no tiene fecha de inicio y fin.`);
    ph.steps = (ph.steps || []).map(s => ({...s, id:s.id || 'u' + uid(), title:s.title || 'Paso'}));
    ph.milestones = (ph.milestones || []).map(m => ({...m, id:m.id || 'u' + uid(), title:m.title || 'Hito', date:m.date || ph.end}));
  });
  return d;
}

async function copyText(txt, ok){ if (AND && andCall('copy', txt)){ toast(ok); return; } try { await navigator.clipboard.writeText(txt); toast(ok); } catch (e) { prompt('Copia este texto:', txt); } }

function rmCalc(p){
  const R = p.roadmap, phases = R.data.phases, t = TODAY();
  let cur = phases.findIndex(ph => t >= ph.start && t <= ph.end);
  if (cur < 0){ const nx = phases.findIndex(ph => ph.start > t); cur = nx >= 0 ? nx : phases.length - 1; } // entre fases → la siguiente; al final → la última
  const items = phases.flatMap(phaseItems);
  const done = items.filter(i => R.done[i.id]).length;
  const dates = stepDates(p), byD = (a, b) => (dates[a.id] || '').localeCompare(dates[b.id] || '');
  const late = phases.slice(0, cur).flatMap(ph => ph.steps.filter(s => !R.done[s.id]).map(s => ({...s, late:true}))).sort(byD);
  const next = [...late, ...phases[cur].steps.filter(s => !R.done[s.id]).sort(byD)];
  const ritualsToday = (R.data.rituals || []).filter(r => scheduled(r, new Date()));
  return {cur, phase:phases[cur], total:items.length, done, pct:items.length ? Math.round(done / items.length * 100) : 0, next, ritualsToday};
}
function streak(p, r){
  const log = new Set(p.roadmap.rituals[r.id] || []);
  let d = new Date(), n = 0;
  if (!log.has(iso(d))) d = addDays(d, -1);
  for (let i = 0; i < 1500; i++){
    if (scheduled(r, d)){ if (log.has(iso(d))) n++; else break; }
    d = addDays(d, -1);
  }
  return n;
}

function ritualChip(p, r){
  const on = (p.roadmap.rituals[r.id] || []).includes(TODAY()), st = streak(p, r);
  return `<button class="ritual ${on ? 'on' : ''}" data-act="rmRitual" data-p="${p.id}" data-id="${r.id}">${ic(on ? 'check' : 'plus')}${esc(r.title)}${st > 1 ? ` <span class="muted">· ${st} seguidos</span>` : ''}</button>`;
}
/* Fecha de cada paso: la que tú hayas puesto (R.dates) › la de la hoja (date o pub.date) › repartida dentro de su fase */
function plannedDate(ph, s, i){
  if (s.date) return s.date;
  if (s.pub && s.pub.date) return s.pub.date;
  const n = ph.steps.length, len = Math.max(0, daysBetween(ph.start, ph.end));
  return iso(addDays(parseISO(ph.start), n > 1 ? Math.round(i * len / (n - 1)) : 0));
}
function stepDates(p){
  const R = p.roadmap, out = {};
  R.data.phases.forEach(ph => ph.steps.forEach((s, i) => {
    const lc = linkedContent(p, s.id); // si el paso es una publicación, manda la fecha de la publicación
    out[s.id] = (lc && lc.date) || (R.dates || {})[s.id] || plannedDate(ph, s, i);
  }));
  return out;
}
/* Hora de pasos e hitos: la de la publicación enlazada › la puesta en la app (R.times, '' = sin hora) › la de la hoja */
function stepTime(p, s){
  const lc = linkedContent(p, s.id); if (lc) return lc.time || '';
  const T = p.roadmap.times || {};
  return s.id in T ? T[s.id] : (s.time || (s.pub && s.pub.time) || '');
}
const msTime = (p, m) => { const T = p.roadmap.times || {}; return m.id in T ? T[m.id] : (m.time || ''); };
function setRmTime(R, id, base, val){ R.times = R.times || {}; if (val === (base || '')) delete R.times[id]; else R.times[id] = val; }
/* Hora de fin (opcional): igual que la de inicio, en R.ends */
function stepEnd(p, s){
  const lc = linkedContent(p, s.id); if (lc) return lc.end || '';
  const E = p.roadmap.ends || {};
  return s.id in E ? E[s.id] : (s.end || (s.pub && s.pub.end) || '');
}
const msEnd = (p, m) => { const E = p.roadmap.ends || {}; return m.id in E ? E[m.id] : (m.end || ''); };
function setRmEnd(R, id, base, val){ R.ends = R.ends || {}; if (val === (base || '')) delete R.ends[id]; else R.ends[id] = val; }
const timeRange = (a, b) => a ? (b && b > a ? `${a}–${b}` : a) : '';
const cleanEnd = v => { if (!v.time || (v.end && v.end <= v.time)) v.end = ''; return v; }; // fin solo si hay inicio y es posterior
/* Publicación ⇄ paso de la ruta (R.cal: id del paso → id de la publicación) */
const linkedContent = (p, sid) => { const cid = ((p.roadmap || {}).cal || {})[sid]; return cid ? S.contents.find(c => c.id === cid) : null; };
function contentLink(cid){
  for (const p of S.projects){
    const R = p.roadmap; if (!R || !R.cal) continue;
    for (const [sid, x] of Object.entries(R.cal)){
      if (x !== cid) continue;
      const ph = R.data.phases.find(f => f.steps.some(s => s.id === sid));
      if (ph) return {p, R, ph, s:ph.steps.find(s => s.id === sid)};
    }
  }
  return null;
}
function setDone(p, id, val){ // marcar un paso que es publicación la pasa a «Publicado» (y al revés)
  p.roadmap.done[id] = val;
  const lc = linkedContent(p, id);
  if (lc) lc.status = val ? 'publicado' : (lc.status === 'publicado' ? 'programado' : lc.status);
}
function unlinkContent(l){ // quita el enlace; si el paso nació de la publicación, también el paso
  const {R, ph, s} = l;
  delete R.cal[s.id];
  if (s.fromContent){ ph.steps.splice(ph.steps.indexOf(s), 1); delete R.done[s.id]; if (R.dates) delete R.dates[s.id]; }
  touched(R);
}
function stepRow(p, s){
  const R = p.roadmap, done = !!R.done[s.id];
  const calId = (R.cal || {})[s.id], linked = calId && S.contents.find(c => c.id === calId);
  const date = linked ? linked.date : stepDates(p)[s.id];
  const pub = s.pub ? `<button class="calchip ${linked ? 'on' : ''}" data-act="rmToCal" data-p="${p.id}" data-id="${s.id}">${ic(linked ? 'check' : 'layers')}${linked ? 'Publicación creada' : 'Crear publicación'}${s.pub.time ? ' · ' + s.pub.time : ''}</button>` : '';
  const dateBtn = date ? `<button class="st-date ${!done && date < TODAY() ? 'late' : ''}" data-act="${linked ? 'rmToCal' : 'rmStepEdit'}" data-p="${p.id}" data-id="${s.id}">${ic('cal')}${fmtShort(date)}</button>` : '';
  return `<div class="step ${done ? 'done' : ''}">
    <button class="cb" data-act="rmToggle" data-p="${p.id}" data-id="${s.id}" aria-label="Marcar paso">${ic('check')}</button>
    <div style="flex:1;min-width:0">${s.late && !done ? '<div class="st-flag">De una fase anterior</div>' : ''}<div class="st-t" data-act="rmStepEdit" data-p="${p.id}" data-id="${s.id}">${esc(s.title)}</div>${s.note ? `<div class="st-n">${esc(s.note)}</div>` : ''}<div class="st-acts">${dateBtn}${pub}</div></div>
  </div>`;
}
function phaseTime(ph){
  const t = TODAY();
  if (t < ph.start) return `Empieza ${fmtShort(ph.start).toLowerCase()} · ${shortRange(ph.start, ph.end)}`;
  if (t > ph.end) return `Terminó el ${shortDate(ph.end)}`;
  const left = daysBetween(t, ph.end);
  return left === 0 ? 'Último día de esta fase' : `Quedan ${left} ${left === 1 ? 'día' : 'días'} de fase · hasta el ${shortDate(ph.end)}`;
}

function timelineHTML(p, c){
  const R = p.roadmap, t = TODAY();
  return `<div class="tl-wrap"><div class="tl">${R.data.phases.map((ph, i) => {
    const len = Math.max(1, daysBetween(ph.start, ph.end) + 1);
    const pos = d => Math.min(100, Math.max(0, (daysBetween(ph.start, d) + .5) / len * 100));
    const items = phaseItems(ph), dn = items.filter(x => R.done[x.id]).length;
    const ms = (ph.milestones || []).map(m => `<i class="tl-ms ${R.done[m.id] ? 'done' : ''}" style="left:${pos(m.date)}%" title="${esc(m.title)}"></i>`).join('');
    const today = t >= ph.start && t <= ph.end ? `<div class="tl-today" style="left:${pos(t)}%"><span>HOY</span></div>` : '';
    return `<div class="tl-col" style="--w:${len}"><div class="tl-marks">${ms}</div>${today}
      <button class="tl-ph ${i === c.cur ? 'now' : ''}" style="--pc:var(--rc)" data-act="rmPhase" data-p="${p.id}" data-id="${ph.id}" data-scroll="1">
        <small>Fase ${i + 1} · ${shortRange(ph.start, ph.end)}</small><b>${esc(ph.name)}</b><span class="fill" style="width:${items.length ? dn / items.length * 100 : 0}%"></span>
      </button></div>`;
  }).join('')}</div></div>`;
}

function phaseList(p, c){
  const R = p.roadmap, t = TODAY(), ed = !!S.ui.rmEdit, dates = stepDates(p);
  return R.data.phases.map((ph, i) => {
    const items = phaseItems(ph), dn = items.filter(x => R.done[x.id]).length;
    const complete = items.length && dn === items.length;
    const state = complete ? 'done' : i === c.cur ? 'now' : ph.end < t ? 'past' : 'future';
    const key = p.id + ':' + ph.id;
    const open = ed || (key in S.ui.phaseOpen ? S.ui.phaseOpen[key] : i === c.cur);
    const lbl = {done:'Completada', now:'En curso', past:'Con pendientes', future:'Próxima'}[state];
    const steps = [...ph.steps].sort((a, b) => (dates[a.id] || '').localeCompare(dates[b.id] || ''));
    const ms = (ph.milestones || []).map(m => `<div class="ms ${R.done[m.id] ? 'done' : ''}"><i class="dia"></i>
        <div class="ms-main" ${ed ? `data-act="rmMsEdit" data-p="${p.id}" data-ph="${ph.id}" data-id="${m.id}"` : ''}><b>${esc(m.title)}</b><div class="muted small">Hito · ${fmtLong(m.date)}${ed ? ' · toca para editar' : ''}</div></div>
        <button class="cb" data-act="rmToggle" data-p="${p.id}" data-id="${m.id}" aria-label="Marcar hito">${ic('check')}</button></div>`).join('');
    const top = ed ? `<div class="ph-tools"><button class="btn ghost sm" data-act="rmPhaseEdit" data-p="${p.id}" data-id="${ph.id}">${ic('edit')}Editar fase</button></div>` : '';
    const add = ed ? `<div class="ph-tools"><button class="btn ghost sm" data-act="rmStepNew" data-p="${p.id}" data-id="${ph.id}">${ic('plus')}Paso</button><button class="btn ghost sm" data-act="rmPubNew" data-p="${p.id}" data-id="${ph.id}">${ic('plus')}Publicación</button><button class="btn ghost sm" data-act="rmMsNew" data-p="${p.id}" data-id="${ph.id}">${ic('plus')}Hito</button></div>` : '';
    return `<div class="ph ${state} ${open ? 'open' : ''}" id="ph-${ph.id}">
      <span class="rm-num">${complete ? ic('check') : i + 1}</span>
      <div class="ph-card">
        <button class="ph-h" data-act="rmPhase" data-p="${p.id}" data-id="${ph.id}"><div><small>${lbl} · ${shortRange(ph.start, ph.end)}</small><b>${esc(ph.name)}</b></div><span class="count">${dn}/${items.length}</span>${ic('chev')}</button>
        <div class="ph-bar"><span style="width:${items.length ? dn / items.length * 100 : 0}%"></span></div>
        ${open ? `<div class="ph-b">${top}${ph.objective ? `<p class="ph-obj">${esc(ph.objective)}</p>` : ''}${steps.map(s => stepRow(p, s)).join('')}${ms}${!items.length && !ed ? '<p class="muted small">Sin pasos todavía.</p>' : ''}${add}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

  if (!R) return `<div class="empty" style="padding:28px 18px"><b>Este proyecto aún no tiene hoja de ruta</b>Pídele a Claude que te la diseñe y cárgala aquí, o empieza una tú.

  const d = R.data, c = rmCalc(p), t = TODAY(), ed = !!S.ui.rmEdit;
  const left = d.target ? daysBetween(t, d.target.date) : null;
  const upd = rmIndex.find(e => e.id === R.src.id && e.version > R.src.version);

    ? `<div class="count-big"><b>${left}</b><small>${left === 1 ? 'día' : 'días'} para ${esc(d.target.label)}</small></div>`

    <div class="rm-bar"><span class="muted">${ed ? 'Modo edición: toca cualquier paso, fase, hito o hábito para cambiarlo.' : `<button class="btn ghost sm" data-act="createMenu">${ic('plus')}Añadir</button>`}</span><button class="btn ${ed ? '' : 'ghost'} sm" data-act="rmEditMode">${ed ? ic('check') + 'Listo' : ic('edit') + 'Editar hoja'}</button></div>
    <div class="rm-hero">
      ${ed ? `<button class="rm-hero-edit" data-act="rmHeroEdit" aria-label="Editar título y meta">${ic('edit')}</button>` : ''}
      <div class="eyebrow">Hoja de ruta</div>
      <h2>${esc(d.title)}</h2>
      ${d.goal ? `<div class="goal">${esc(d.goal)}</div>` : ''}
      <div class="rm-stats"><div class="ring" style="--p:${c.pct}"><span>${c.pct}%</span></div>${counter}</div>
    </div>
    <div class="rm-today">
      <h3>Hoy en la ruta</h3>
      <div class="rm-phase-now"><span class="rm-num" style="background:var(--rc);color:#141417">${c.cur + 1}</span><div><b>${esc(c.phase.name)}</b><div class="muted small">${phaseTime(c.phase)}</div></div></div>
      ${c.ritualsToday.length ? `<div class="rituals">${c.ritualsToday.map(r => ritualChip(p, r)).join('')}</div>` : ''}
      <div class="rm-sub" style="margin-top:4px">Siguientes pasos</div>
      ${c.next.slice(0, 3).map(s => stepRow(p, s)).join('') || '<p class="muted small">Fase al día. Puedes adelantar la siguiente.</p>'}
      ${c.next.length > 3 ? `<p class="muted small" style="margin:8px 0 0">+${c.next.length - 3} pasos más pendientes</p>` : ''}
    </div>
    <div class="rm-sub">Línea de tiempo</div>
    ${timelineHTML(p, c)}
    <div class="rm-sub">Fases</div>
    ${phaseList(p, c)}
    ${ed ? `<button class="btn ghost" style="width:100%;margin-top:2px" data-act="rmPhaseNew">${ic('plus')}Nueva fase</button>` : ''}
    ${(d.rituals || []).length || ed ? `<section><div class="rm-sub">Hábitos</div>${(d.rituals || []).map(r => {
      const on = (R.rituals[r.id] || []).includes(t), st = streak(p, r);
      return `<div class="habit"><div class="h-main" data-act="rmHabitEdit" data-p="${p.id}" data-id="${r.id}"><b>${esc(r.title)}</b><div class="muted small">${freqLabel(r.days)}${r.time ? ' · ' + timeRange(r.time, r.end) : ''}${r.note ? ' · ' + esc(r.note) : ''}${ed ? ' · toca para editar' : ''}</div></div><span class="streak">${st ? st + ' seguidos' : ''}</span>${scheduled(r, new Date()) ? `<button class="cb" style="${on ? 'background:var(--text);border-color:var(--text);color:var(--bg)' : ''}" data-act="rmRitual" data-p="${p.id}" data-id="${r.id}" aria-label="Marcar hábito de hoy">${ic('check')}</button>` : ''}</div>`;
    }).join('')}${ed ? `<button class="btn ghost" style="width:100%;margin-top:8px" data-act="rmHabitNew">${ic('plus')}Nuevo hábito</button>` : ''}</section>` : ''}
    <div class="row-btns" style="margin-top:22px"><button class="btn ghost sm" data-act="rmCopy">Copiar para Claude</button><button class="btn ghost sm" data-act="rmImport" data-p="${p.id}">Actualizar desde texto</button>${S.library.some(x => x.id === R.data.id) ? '' : '<button class="btn ghost sm" data-act="rmSaveLib">Guardar en Mis hojas</button>'}<button class="btn ghost sm" data-act="rmLoad">Cambiar hoja de ruta</button><button class="btn ghost sm danger" data-act="rmRemove">Quitar</button></div>

  </div>`;
}

function rmMini(p){
  const c = rmCalc(p), d = p.roadmap.data, n = c.next[0];
  const left = d.target ? daysBetween(TODAY(), d.target.date) : 0;
  return `<div class="rm-mini" style="--rc:${rmColor(p)}">
    <button class="rm-mini-h" data-act="openRuta" data-id="${p.id}"><div><small>${esc(p.name)} · Fase ${c.cur + 1} de ${d.phases.length}</small><b>${esc(c.phase.name)}</b></div>${left > 0 ? `<div class="rm-days"><b>${left}</b><small>días</small></div>` : ''}</button>
    <div class="ph-bar" style="margin:0 0 12px"><span style="width:${c.pct}%"></span></div>
    ${c.ritualsToday.length ? `<div class="rituals">${c.ritualsToday.map(r => ritualChip(p, r)).join('')}</div>` : ''}
    ${n ? stepRow(p, n) : '<p class="muted small">Fase al día.</p>'}
  </div>`;
}

/* ---------- Avisos: los programa el propio móvil (app Android), sin servidor ni push ---------- */
const BEFORE_OPTS = [[0, 'A la hora exacta'], [5, '5 min antes'], [15, '15 min antes'], [30, '30 min antes'], [60, '1 hora antes'], [120, '2 horas antes'], [1440, '1 día antes']];
function pushState(){ return AND ? (notifOn() ? 'on' : 'off') : 'unsupported'; }
const atTime = (dateStr, timeStr) => { const [h, m] = (timeStr || '09:00').split(':').map(Number); const d = parseISO(dateStr); d.setHours(h, m, 0, 0); return d.getTime(); };
function fmtWhen(ms){ const d = new Date(ms); return `${fmtShort(iso(d))} · ${pad(d.getHours())}:${pad(d.getMinutes())}`; }

/* Calcula aquí (con tu zona horaria) todos los avisos de los próximos 14 días */
function computeEvents(){
  const N = S.notif, now = Date.now(), horizon = now + 14 * 864e5, ev = [];
  const ok = t => t > now - 60000 && t < horizon;
  if (N.pub.on) S.contents.forEach(c => {
    if (!c.date || c.status === 'publicado') return;
    const t = atTime(c.date, c.time || '09:00') - N.pub.before * 60000;
    if (!ok(t)) return;
    const p = prof(c.profileId);
    const when = (BEFORE_OPTS.find(o => o[0] === N.pub.before) || [0, ''])[1];
    ev.push({id:`c:${c.id}:${t}`, at:t,
      title: N.pub.before === 0 ? `Toca publicar: ${c.title}`
        : `${c.date === iso(new Date(t)) ? (c.time || 'Hoy') : parseISO(c.date).toLocaleDateString('es-ES', {weekday:'short', day:'numeric'}) + (c.time ? ' ' + c.time : '')} · ${c.title}`,
      body: [p && p.name, c.platform, c.format, N.pub.before ? when.replace(' antes', ' para publicar') : ''].filter(Boolean).join(' · ')});
  });
  if (N.daily.on) for (let i = 0; i < 14; i++){
    const day = addDays(new Date(), i), k = iso(day), dow = day.getDay();
    if (N.daily.days === 'weekdays' && (dow === 0 || dow === 6)) continue;
    const t = atTime(k, N.daily.time);
    if (!ok(t)) continue;
    const pubs = S.contents.filter(c => c.date === k && c.status !== 'publicado').sort(byDate);
    const tks = S.tasks.filter(x => !x.done && x.due && x.due <= k);
    const parts = [];
    if (pubs.length) parts.push(pubs.slice(0, 3).map(c => (c.time ? c.time + ' ' : '') + c.title).join(' · ') + (pubs.length > 3 ? ` (+${pubs.length - 3})` : ''));
    if (tks.length) parts.push(`${tks.length} ${tks.length === 1 ? 'tarea vence' : 'tareas vencen'} hoy o antes`);
    ev.push({id:`d:${k}:${t}`, at:t,
      title: pubs.length ? `Hoy: ${pubs.length} ${pubs.length === 1 ? 'publicación' : 'publicaciones'}` : 'Tu día en Pizarra',
      body: parts.join(' — ') || 'Día libre: nada programado ni tareas urgentes.'});
  }
  if (N.tasks.on) S.tasks.forEach(x => {
    if (x.done || !x.due || (x.rm && x.rm.ph) || (N.tasks.which === 'alta' && x.priority !== 'alta')) return;
    const t = atTime(iso(addDays(parseISO(x.due), -N.tasks.daysBefore)), N.tasks.daysBefore === 0 && x.time ? x.time : N.tasks.time); // con hora: avisa a esa hora
    if (!ok(t)) return;
    const pj = project(x.projectId);
    ev.push({id:`t:${x.id}:${t}`, at:t,
      title: N.tasks.daysBefore === 0 ? `Vence hoy: ${x.title}` : N.tasks.daysBefore === 1 ? `Vence mañana: ${x.title}` : `Vence en ${N.tasks.daysBefore} días: ${x.title}`,
      body: [pj && pj.name, `Prioridad ${x.priority}`].filter(Boolean).join(' · ')});
  });
  return ev.sort((a, b) => a.at - b.at).slice(0, 400);
}

let syncTimer, lastSent = '';
function scheduleSync(){ if (!notifOn()) return; clearTimeout(syncTimer); syncTimer = setTimeout(() => syncPush(), 1500); }
/* El móvil programa sus propias alarmas con estos avisos (y los recalcula también al sincronizar en segundo plano) */
function syncPush(force){
  if (pushState() !== 'on') return;
  const ev = JSON.stringify(computeEvents());
  if (force || ev !== lastSent){ andCall('setEvents', ev); lastSent = ev; }
}

    <div class="ncard">${toggleRow('tasks.on', 'Tareas que vencen', 'Según la fecha límite de cada tarea')}
      ${N.tasks.on ? `<div class="nopts">${selectOpt('tasks.daysBefore', 'Cuándo', [[0, 'El mismo día'], [1, '1 día antes'], [2, '2 días antes']], N.tasks.daysBefore)}${timeOpt('tasks.time', 'Hora', N.tasks.time)}${selectOpt('tasks.which', 'Qué tareas', [['all', 'Todas'], ['alta', 'Solo prioridad alta']], N.tasks.which)}</div>` : ''}</div>
    <section>

    </section>`;

function fieldHTML(f, val){
  val = val ?? f.default ?? '';
  const id = 'f_' + f.key;
  let inp;
  switch (f.type){
    case 'textarea': inp = `<textarea id="${id}" name="${f.key}" rows="3" placeholder="${esc(f.placeholder || '')}">${esc(val)}</textarea>`; break;
    case 'select': inp = `<select id="${id}" name="${f.key}">${f.options.map(o => `<option value="${esc(o.v)}" ${String(o.v) === String(val) ? 'selected' : ''}>${esc(o.l)}</option>`).join('')}</select>`; break;
    case 'color': {
      const quick = COLORS.includes(val);
      inp = `<div class="swatches">${COLORS.map(c => `<label class="sw" style="--c:${c}"><input type="radio" name="${f.key}" value="${c}" ${c === val ? 'checked' : ''}><span></span></label>`).join('')}</div>
        <details class="cgrid" ${val && !quick ? 'open' : ''}><summary>${ic('chev')}Más colores</summary>
          <div class="cgrid-g">${COLOR_GRID.map(c => `<label class="sq" style="--c:${c}" title="${c}"><input type="radio" name="${f.key}" value="${c}" ${!quick && c === val ? 'checked' : ''}><span></span></label>`).join('')}</div>
        </details>`;
      break;
    }
    case 'time5': { // hora de 5 en 5 minutos (el selector de iOS no respeta step)
      const [hh, mm = '00'] = String(val || '').split(':');
      const mins = Array.from({length:12}, (_, i) => pad(i * 5));
      if (!mins.includes(mm)) mins.push(mm), mins.sort();
      inp = `<div class="time5"><select id="${id}" name="${f.key}_h" aria-label="Hora"><option value="">${f.none || 'Sin hora'}</option>${Array.from({length:24}, (_, h) => `<option value="${pad(h)}" ${val && hh === pad(h) ? 'selected' : ''}>${pad(h)} h</option>`).join('')}</select>
        <b>:</b><select name="${f.key}_m" aria-label="Minutos">${mins.map(m => `<option value="${m}" ${mm === m ? 'selected' : ''}>${m}</option>`).join('')}</select></div>`;
      break;
    }
    case 'days': {
      const on = new Set((val || []).map(Number));
      inp = `<div class="daypick">${[1, 2, 3, 4, 5, 6, 0].map(n => `<label><input type="checkbox" name="${f.key}" value="${n}" ${on.has(n) ? 'checked' : ''}><span>${'DLMXJVS'[n]}</span></label>`).join('')}</div>`;
      break;
    }
    case 'info': return `<div class="field finfo"><label>${esc(f.label)}</label><div class="finfo-v" id="${id}"></div></div>`; // se rellena solo (calc)
    case 'checkbox': return `<label class="check"><input type="checkbox" name="${f.key}" ${val ? 'checked' : ''}> ${esc(f.label)}</label>`;
    default: inp = `<input id="${id}" name="${f.key}" type="${f.type || 'text'}" value="${esc(val)}" placeholder="${esc(f.placeholder || '')}" autocomplete="off">`;
  }
  return `<div class="field ${f.half ? 'half' : f.third ? 'third' : ''}"><label for="${id}">${esc(f.label)}</label>${inp}</div>`;
}

const readForm = (form, fields) => {
  const fd = new FormData(form), v = {};
  for (const f of fields) v[f.key] = f.type === 'checkbox' ? fd.has(f.key) : f.type === 'days' ? fd.getAll(f.key).map(Number)
    : f.type === 'time5' ? (fd.get(f.key + '_h') ? `${fd.get(f.key + '_h')}:${fd.get(f.key + '_m') || '00'}` : '')
    : String(fd.get(f.key) ?? '').trim();
  return v;
};
function openForm({title, fields, values = {}, onSave, onDelete, note, preview, saveLabel = 'Guardar', saveDanger = false}){

  sh.classList.add('open'); document.body.classList.add('locked');

  if (preview || infos.length){ // se repinta con cada cambio del formulario (vista previa y campos automáticos)
    const paint = () => {

    };

    if (missing){ const el = form.querySelector(`[name="${missing.key}"]`); el && el.focus(); toast(`Falta: ${missing.label}`); return; }
    onSave(v); closeSheet(); render();

  if (!values[fields[0].key] && fields[0].type !== 'date') setTimeout(() => { const el = form.querySelector(`[name="${fields[0].key}"]`); el && el.focus(); }, 60);
}

const calmMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function closeSheet(){
  const sh = $('#sheet');
  if (sh.classList.contains('open') && sh.firstChild && !calmMotion()){ // la hoja se va con animación: se mueve a una copia que se desvanece
    const g = document.createElement('div'); g.className = 'sheet-ghost' + (sh.classList.contains('has-pv') ? ' has-pv' : '');
    while (sh.firstChild) g.appendChild(sh.firstChild);
    g.querySelectorAll('[id]').forEach(x => x.removeAttribute('id'));
    document.body.appendChild(g); setTimeout(() => g.remove(), 300);
  }
  sh.classList.remove('open', 'has-pv'); sh.innerHTML = ''; delete sh.dataset.day; document.body.classList.remove('locked');
  // datos nuevos que llegaron con la ficha abierta: se cargan ahora (sin pisar lo que se estaba editando)
  if (ncPending) setTimeout(ncAdopt, 320); // datos que llegaron con la ficha abierta
  if (NUBE && PizarraNube.conectado()) PizarraNube.programar(400); // web en Nextcloud: lo que esperaba a que se cerrara
}
/* Deslizar la hoja hacia abajo desde su cabecera para cerrarla (móvil) */
let sheetDrag = null;
document.addEventListener('touchstart', e => {
  const s = e.target.closest('#sheet .sheet');
  if (!s || innerWidth >= 700 || !e.target.closest('.grab,.sheet-h') || e.target.closest('button')) return;
  sheetDrag = {s, y:e.touches[0].clientY, dy:0};
}, {passive:true});
document.addEventListener('touchmove', e => {
  if (!sheetDrag) return;
  sheetDrag.dy = Math.max(0, e.touches[0].clientY - sheetDrag.y);
  sheetDrag.s.classList.add('dragging'); sheetDrag.s.style.transform = `translateY(${sheetDrag.dy}px)`;
}, {passive:true});
document.addEventListener('touchend', () => {
  if (!sheetDrag) return;
  const {s, dy} = sheetDrag; sheetDrag = null; s.classList.remove('dragging');
  if (dy > 110) closeSheet();
  else { s.classList.add('snap'); s.style.transform = ''; setTimeout(() => s.classList.remove('snap'), 320); }
});

/* ---------- Edición de la hoja de ruta desde la app ---------- */
const touched = R => {
  R.edited = true; R.data.phases.sort((a, b) => a.start.localeCompare(b.start));
  if (S.library.some(x => x.id === R.data.id)) saveToLibrary(R.data); // Mis hojas guarda siempre la última versión
};
const findPhase = (p, id) => p.roadmap.data.phases.find(x => x.id === id);
const findStep = (p, id) => p.roadmap.data.phases.flatMap(ph => ph.steps).find(x => x.id === id);
const linkedTask = (p, kind, id) => S.tasks.find(t => t.projectId === p.id && t.rm && t.rm[kind] === id);

/* Ruta ⇄ tareas: cada fase es una tarea principal y cada paso, una subtarea suya.
   La hoja de ruta manda en título, notas, fecha y hecho; la tarea guarda lo suyo
   (importancia, orden y las subtareas normales que cuelgues de un paso). */
function syncRoadmapTasks(p){
  const R = p.roadmap;
  const linked = S.tasks.filter(t => t.projectId === p.id && t.rm);
  if (!R){ if (linked.length){ const g = new Set(linked.map(t => t.id)); S.tasks.forEach(t => { if (g.has(t.parentId)) t.parentId = ''; }); S.tasks = S.tasks.filter(t => !g.has(t.id)); } return; }
  if (p.color) R.data.color = p.color; // la hoja hereda el color del proyecto (también al copiarla para Claude)
  Object.entries(R.cal || {}).forEach(([sid, cid]) => { // publicación «Publicado» → paso hecho
    const c = S.contents.find(x => x.id === cid); if (c && c.status === 'publicado') R.done[sid] = true;
  });
  const byKey = new Map(linked.map(t => [t.rm.ph ? 'ph:' + t.rm.ph : 's:' + t.rm.s, t]));
  const keep = new Set(), dates = stepDates(p);
  R.data.phases.forEach((ph, i) => {
    let pt = byKey.get('ph:' + ph.id);
    if (!pt){ pt = {id:uid(), projectId:p.id, priority:'media', rm:{ph:ph.id}}; S.tasks.push(pt); }
    const items = phaseItems(ph);
    Object.assign(pt, {parentId:'', title:ph.name, due:ph.end, notes:ph.objective || '', done:items.length > 0 && items.every(x => R.done[x.id]), order:-1000 + i});
    keep.add(pt.id);
    ph.steps.forEach(s => {
      let st = byKey.get('s:' + s.id);
      if (!st){ st = {id:uid(), projectId:p.id, priority:s.pub ? 'alta' : 'media', order:nextOrder(p.id, pt.id), rm:{s:s.id}}; S.tasks.push(st); }
      if (st.parentId !== pt.id) st.order = nextOrder(p.id, pt.id);
      Object.assign(st, {parentId:pt.id, title:s.title, notes:s.note || '', due:dates[s.id], time:stepTime(p, s), end:stepEnd(p, s), done:!!R.done[s.id]});
      keep.add(st.id);
    });
  });
  const gone = new Set(linked.filter(t => !keep.has(t.id)).map(t => t.id));
  if (gone.size){ S.tasks.forEach(t => { if (gone.has(t.parentId)) t.parentId = ''; }); S.tasks = S.tasks.filter(t => !gone.has(t.id)); }
}
const phaseNum = t => { const p = project(t.projectId); return p && p.roadmap ? p.roadmap.data.phases.findIndex(x => x.id === t.rm.ph) + 1 : 0; };

function stepForm(p, s, ph){ // s = null → paso nuevo dentro de ph
  const R = p.roadmap, isNew = !s;
  ph = ph || R.data.phases.find(x => x.steps.includes(s));
  const planned = s ? plannedDate(ph, s, ph.steps.indexOf(s)) : null, n = R.data.phases.indexOf(ph) + 1, t = TODAY();
  const lt = s && linkedTask(p, 's', s.id);
  openForm({
    title: isNew ? 'Nuevo paso' : 'Paso de la hoja de ruta',
    note: `${esc(p.name)}${planned ? ` · Fecha prevista en la hoja: ${fmtLong(planned)}. Si borras la fecha, vuelve a ella.` : ''}`,
    values: isNew ? {date:t >= ph.start && t <= ph.end ? t : ph.start, phase:ph.id, priority:'media', time:'', end:''}
      : {title:s.title, note:s.note || '', date:stepDates(p)[s.id], time:stepTime(p, s), end:stepEnd(p, s), phase:ph.id, priority:lt ? lt.priority : (s.pub ? 'alta' : 'media'), done:!!R.done[s.id]},
    preview: v => pvStep(p, v),
    fields: [
      {key:'title', label:'Paso', required:true, placeholder:'¿Qué hay que hacer?'},
      {key:'note', label:'Detalle (opcional)', type:'textarea'},
      {key:'date', label:'Fecha', type:'date', required:isNew},
      {key:'time', label:'Empieza', type:'time5', half:true},
      {key:'end', label:'Termina', type:'time5', half:true, none:'Sin fin'},
      {key:'priority', label:'Importancia', type:'select', options:PRIOS.map(x => ({v:x.k, l:x.l}))},
      {key:'phase', label:'Fase', type:'select', options:R.data.phases.map((x, k) => ({v:x.id, l:`Fase ${k + 1} · ${x.name}`}))},
      ...(isNew ? [] : [{key:'done', label:'Hecho', type:'checkbox'}])
    ],
    onSave: v => {
      const target = findPhase(p, v.phase) || ph;
      if (isNew){
        const id = 'u' + uid();
        target.steps.push({id, title:v.title, date:v.date, ...(v.time ? {time:v.time} : {}), ...(v.end ? {end:v.end} : {}), ...(v.note ? {note:v.note} : {})});
        S.tasks.push({id:uid(), projectId:p.id, parentId:'', title:v.title, priority:v.priority, due:v.date, time:v.time, end:v.end, notes:'', done:false, order:999, rm:{s:id}});
        touched(R); toast('Paso añadido'); return;
      }
      if (v.title !== s.title || v.note !== (s.note || '')){ s.title = v.title; if (v.note) s.note = v.note; else delete s.note; touched(R); }
      if (target !== ph){ ph.steps.splice(ph.steps.indexOf(s), 1); target.steps.push(s); touched(R); }
      R.dates = R.dates || {};
      if (v.date && v.date !== planned) R.dates[s.id] = v.date; else delete R.dates[s.id];
      const lc = linkedContent(p, s.id);
      if (lc && v.date) lc.date = v.date; // mover el paso mueve la publicación
      if (lc){ lc.time = v.time; lc.end = v.end; }
      else { setRmTime(R, s.id, s.time || (s.pub && s.pub.time), v.time); setRmEnd(R, s.id, s.end || (s.pub && s.pub.end), v.end); }
      if (lc && v.done !== !!R.done[s.id]) lc.status = v.done ? 'publicado' : (lc.status === 'publicado' ? 'programado' : lc.status);
      if (lc && s.fromContent) lc.title = v.title;
      R.done[s.id] = v.done;
      if (lt) lt.priority = v.priority;
      toast(target !== ph ? `Paso movido a «${target.name}»` : 'Paso guardado');
    },
    onDelete: isNew ? null : () => {
      if (!confirm('¿Eliminar este paso de la hoja de ruta?')) return false;
      ph.steps.splice(ph.steps.indexOf(s), 1);
      delete R.done[s.id]; if (R.dates) delete R.dates[s.id]; if (R.cal) delete R.cal[s.id];
      touched(R);
    }
  });
}

/* ---------- Vistas previas de los formularios (se pintan con los mismos estilos de la app) ---------- */
const pvName = s => s ? esc(s) : '<span class="muted">Sin título</span>';
function pvCell(date, kind, color, done){
  return `<span class="cell pv-cell ${date === TODAY() ? 'today' : ''}"><span class="dn">${date ? Number(date.slice(8, 10)) : '–'}</span><span class="dots"><i class="k-${kind} ${done ? 'on' : ''}" style="--ic:${color}"></i></span></span>`;
}
const pvTag = (color, text) => `<span class="pv-tag" style="--pc:${color}"><i class="dot"></i>${text}</span>`;
function pvPhaseTag(p, ph){
  if (!p || !ph) return '';
  return pvTag(rmColor(p), `${esc(p.name)} · Fase ${p.roadmap.data.phases.indexOf(ph) + 1}: ${esc(ph.name)}`);
}
function pvContent(v){
  const [pid, phid] = (v.rm || '').split('|'), p = pid && project(pid), ph = p && p.roadmap && findPhase(p, phid);
  const color = ph ? rmColor(p) : pColor(v.profileId);
  return `${pvPhaseTag(p, ph)}<div class="pv-row">${pvCell(v.date, 'c', color, v.status === 'publicado')}${contentRow({...v, id:'pv', title:v.title || 'Sin título'}, {date:true, color})}</div>`;
}
function pvTask(pid, v){
  const par = task(v.parentId), p = project(pid);
  const row = taskRow({id:'pv', projectId:pid, parentId:v.parentId, title:v.title || 'Sin título', priority:v.priority, due:v.due, time:v.time, end:v.end, notes:v.notes, done:!!v.done, order:0}, {actions:false});
  if (par && par.rm && par.rm.ph && p.roadmap){ // colgada de una fase → será un paso de la ruta
    const ph = findPhase(p, par.rm.ph);
    return `${pvPhaseTag(p, ph)}<div class="pv-row">${pvCell(v.due, 's', rmColor(p), v.done)}${row}</div>`;
  }
  return row;
}
function pvStep(p, v){
  const color = rmColor(p), ph = findPhase(p, v.phase), pr = PRIOS.find(x => x.k === v.priority) || PRIOS[1];
  return `${pvPhaseTag(p, ph)}<div class="pv-row">${pvCell(v.date, 's', color, v.done)}
    <div class="pv-card" style="border-left:4px solid ${color}"><div class="step ${v.done ? 'done' : ''}"><span class="cb">${ic('check')}</span>
      <div style="flex:1;min-width:0"><div class="st-t">${pvName(v.title)}</div>${v.note ? `<div class="st-n">${esc(v.note)}</div>` : ''}
      <div class="tmeta"><span class="prio ${pr.k}">${pr.l}</span>${v.date ? `<span>${fmtShort(v.date)}${v.time ? ' · ' + timeRange(v.time, v.end) : ''}</span>` : ''}</div></div></div></div></div>`;
}
function pvMs(p, ph, v){
  const color = rmColor(p);
  return `${pvPhaseTag(p, ph)}<div class="pv-row">${pvCell(v.date, 'm', color, v.done)}<div class="crow ${v.done ? 'done' : ''}" style="--pc:${color}"><i class="dia"></i><div class="cbody"><div class="ctl">${pvName(v.title)}</div><div class="cmeta">Hito · ${v.date ? fmtLong(v.date) : 'sin fecha'}${v.time ? ' · ' + timeRange(v.time, v.end) : ''}</div></div></div></div>`;
}
function pvPhase(p, ph, v){
  const ps = p.roadmap.data.phases, n = ph ? ps.indexOf(ph) + 1 : ps.length + 1, t = TODAY();
  const [a, b] = v.end && v.start && v.end < v.start ? [v.end, v.start] : [v.start, v.end];
  const now = a && b && t >= a && t <= b;
  const items = ph ? phaseItems(ph) : [], dn = items.filter(x => p.roadmap.done[x.id]).length;
  return `<div class="rm" style="--rc:${rmColor(p)}"><div class="ph ${now ? 'now' : ''} open"><span class="rm-num">${n}</span><div class="ph-card">
    <div class="ph-h"><div><small>${now ? 'En curso' : 'Fase ' + n}${a && b ? ' · ' + shortRange(a, b) : ''}</small><b>${pvName(v.name)}</b></div><span class="count">${dn}/${items.length}</span></div>
    <div class="ph-bar"><span style="width:${items.length ? dn / items.length * 100 : 0}%"></span></div>${v.objective ? `<p class="ph-obj">${esc(v.objective)}</p>` : ''}</div></div></div>`;
}
function pvHabit(p, v){
  const days = v.days.length === 7 ? [] : v.days;
  return `<div class="rm" style="--rc:${rmColor(p)}"><div class="rituals"><span class="ritual">${ic('plus')}${pvName(v.title)}</span></div>
    <div class="pv-card" style="margin-top:8px;border-left:4px solid ${rmColor(p)}"><div class="habit"><div><b>${pvName(v.title)}</b><div class="muted small">${freqLabel(days)}${v.time ? ' · ' + timeRange(v.time, v.end) : ''}${v.note ? ' · ' + esc(v.note) : ''}</div></div></div></div></div>`;
}
function pvHero(p, v){
  const left = v.tdate ? daysBetween(TODAY(), v.tdate) : null;
  return `<div class="rm" style="--rc:${v.color || rmColor(p)}"><div class="rm-hero"><div class="eyebrow">Hoja de ruta</div><h2>${pvName(v.title)}</h2>${v.goal ? `<div class="goal">${esc(v.goal)}</div>` : ''}
    ${left != null && left > 0 ? `<div style="margin-top:6px;font-size:12.5px;color:#B9B8BE"><b style="color:var(--rc);font-size:18px">${left}</b> días para ${esc(v.label || 'la meta')}</div>` : ''}</div></div>`;
}
function pvProject(v){
  const color = v.color || '#8A8A93', pr = prof(v.profileId);
  return `<div class="pv-card"><div class="ptag">${pr ? `<i class="dot" style="background:${color}"></i>${esc(pr.name)} · mismo color` : 'Sin perfil'}</div>
    <b style="font-size:19px;display:block;margin-top:2px">${pvName(v.name)}</b><div class="bar" style="margin:8px 0 2px"><span style="width:40%;background:${color}"></span></div></div>
    <div class="pv-row"><span class="dots" style="max-width:none"><i class="k-s on" style="--ic:${color}"></i><i class="k-s" style="--ic:${color}"></i><i class="k-m" style="--ic:${color}"></i></span><span class="muted small">Así salen sus pasos e hitos en el calendario</span></div>`;
}
function pvProfile(v){
  const c = v.color || '#8A8A93', ini = (v.name || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
  return `<div class="pcard" style="--pc:${c}"><div class="pcard-top"><div class="avatar">${esc(ini)}</div><div><b>${pvName(v.name)}</b><div class="muted small">${esc(v.handle || '')}</div></div></div></div>
    <div class="pv-row"><span class="pchip" style="--pc:${c}"><i class="dot"></i>${pvName(v.name)}</span><span class="dots" style="max-width:none"><i class="k-c on" style="--ic:${c}"></i><i class="k-c" style="--ic:${c}"></i></span></div>`;
}

function contentForm(c, date = '', rmPreset = '', profPreset = '', timePreset = ''){
  const firstVisible = (S.profiles.find(p => S.ui.sel.includes(p.id)) || S.profiles[0] || {}).id || '';
  const rmOpts = [{v:'', l:'— No va en ninguna hoja de ruta'}];
  S.projects.filter(p => p.roadmap).forEach(p => p.roadmap.data.phases.forEach((ph, i) =>
    rmOpts.push({v:`${p.id}|${ph.id}`, l:`${p.name} · Fase ${i + 1}: ${ph.name}`})));
  const link = c && contentLink(c.id);
  openForm({
    title: c ? 'Editar publicación' : 'Nueva publicación',
    values: c ? {...c, rm:link ? `${link.p.id}|${link.ph.id}` : ''} : {date, status:'idea', profileId:profPreset || firstVisible, platform:'Instagram', format:'Reel', rm:rmPreset, time:timePreset},
    preview: pvContent,
    fields: [
      {key:'title', label:'Título o idea', required:true, placeholder:"Ej. Balonmano en 30'' · Pasos"},
      {key:'profileId', label:'Perfil', type:'select', half:true, options:profileOpts()},
      {key:'status', label:'Estado', type:'select', half:true, options:STATUSES.map(s => ({v:s.k, l:s.l}))},
      {key:'platform', label:'Plataforma', type:'select', half:true, options:PLATFORMS.map(x => ({v:x, l:x}))},
      {key:'format', label:'Formato', type:'select', half:true, options:FORMATS.map(x => ({v:x, l:x}))},
      {key:'date', label:'Fecha', type:'date'},
      {key:'time', label:'Empieza', type:'time5', half:true},
      {key:'end', label:'Termina', type:'time5', half:true, none:'Sin fin'},
      {key:'notes', label:'Notas, guion, copy…', type:'textarea'},
      ...(rmOpts.length > 1 ? [{key:'rm', label:'Hoja de ruta: ¿en qué fase va?', type:'select', options:rmOpts}] : [])
    ],
    onSave: v => {
      const rmSel = v.rm; delete v.rm;
      let obj = c;
      if (c) Object.assign(c, v); else { obj = {id:uid(), ...v}; S.contents.push(obj); }
      linkContentToPhase(obj, rmSel);
      if (v.date){ S.ui.selDay = v.date; if (S.ui.view === 'calendario') S.ui.month = v.date.slice(0, 7); }
      toast('Publicación guardada');
    },
    onDelete: c ? () => {
      if (!confirm('¿Eliminar esta publicación?')) return false;
      const l = contentLink(c.id); if (l) unlinkContent(l);
      S.contents = S.contents.filter(x => x !== c);
    } : null
  });
}
/* Coloca una publicación en una fase de una hoja de ruta («pid|phid»), la mueve o la quita */
function linkContentToPhase(obj, sel){
  const cur = contentLink(obj.id);
  const [pid, phid] = (sel || '').split('|'), p = pid && project(pid), ph = p && p.roadmap && findPhase(p, phid);
  if (!ph){ if (cur) unlinkContent(cur); return; }
  if (cur && cur.p !== p) unlinkContent(cur);
  const R = p.roadmap, pub = {date:obj.date || '', time:obj.time || '', end:obj.end || '', platform:obj.platform, format:obj.format, title:obj.title};
  let s = cur && cur.p === p ? cur.s : null;
  if (!s){
    s = {id:'u' + uid(), title:obj.title, pub, fromContent:true};
    ph.steps.push(s); R.cal = R.cal || {}; R.cal[s.id] = obj.id;
  } else {
    if (cur.ph !== ph){ cur.ph.steps.splice(cur.ph.steps.indexOf(s), 1); ph.steps.push(s); }
    if (s.fromContent) s.title = obj.title;
    s.pub = {...(s.pub || {}), ...pub};
  }
  R.done[s.id] = obj.status === 'publicado';
  touched(R);
}

function taskForm(t, projectId, parentId = ''){
  const pid = t ? t.projectId : projectId;
  const excl = t ? new Set([t.id, ...descendants(t.id)]) : new Set();
  const parents = [{v:'', l:'— Ninguna (nivel superior)'}, ...treeFlat(pid).filter(x => !excl.has(x.t.id))
    .map(x => ({v:x.t.id, l:'   '.repeat(x.depth) + (x.depth ? '↳ ' : '') + x.t.title}))];
  openForm({
    title: t ? 'Editar tarea' : (parentId ? 'Nueva subtarea' : 'Nueva tarea'),
    values: t || {priority:'media', parentId},
    preview: v => pvTask(pid, v),
    fields: [
      {key:'title', label:'Tarea', required:true, placeholder:'¿Qué hay que hacer?'},
      {key:'due', label:'Fecha', type:'date'},
      {key:'time', label:'Empieza', type:'time5', half:true},
      {key:'end', label:'Termina', type:'time5', half:true, none:'Sin fin'},
      {key:'priority', label:'Importancia', type:'select', options:PRIOS.map(p => ({v:p.k, l:p.l}))},
      {key:'parentId', label:'Cuelga de (tarea padre)', type:'select', options:parents},
      {key:'notes', label:'Notas', type:'textarea'},
      ...(t ? [{key:'done', label:'Completada', type:'checkbox'}] : [])
    ],
    onSave: v => {
      let tk = t;
      if (t){
        const moved = (t.parentId || '') !== v.parentId;
        Object.assign(t, v);
        if (moved) t.order = nextOrder(pid, v.parentId) + 1000;
      } else {
        tk = {id:uid(), projectId:pid, done:false, ...v, order:nextOrder(pid, v.parentId)};
        S.tasks.push(tk);
        if (v.parentId) S.ui.collapsed[v.parentId] = false;
      }
      // Colgada de una fase → pasa a ser un paso de la hoja de ruta (y sale en Ruta y calendario)
      const par = task(v.parentId), p = project(pid);
      if (par && par.rm && par.rm.ph && p.roadmap){
        const ph = findPhase(p, par.rm.ph), R = p.roadmap, t0 = TODAY(), sid = 'u' + uid();
        ph.steps.push({id:sid, title:v.title, date:v.due || (t0 >= ph.start && t0 <= ph.end ? t0 : ph.start), ...(v.time ? {time:v.time} : {}), ...(v.end ? {end:v.end} : {}), ...(v.notes ? {note:v.notes} : {})});
        if (v.done) R.done[sid] = true;
        tk.rm = {s:sid}; touched(R);
        toast(`Añadida a la ruta: fase «${ph.name}»`);
      }
    },
    onDelete: t ? () => {
      const d = descendants(t.id);
      if (!confirm(d.length ? `¿Eliminar la tarea y sus ${d.length} subtareas?` : '¿Eliminar esta tarea?')) return false;
      const kill = new Set([t.id, ...d]); S.tasks = S.tasks.filter(x => !kill.has(x.id));
    } : null
  });
}

function projectForm(p){
  const initial = p ? p.color : COLORS[S.projects.length % COLORS.length];
  // Color único con el perfil: si eliges perfil y no tocas el color, se usa el del perfil; si lo cambias, cambia el del perfil
  const resolve = v => { const pr = prof(v.profileId); return pr && (!v.color || (v.color === initial && v.profileId !== (p ? p.profileId : ''))) ? pr.color : v.color; };
  openForm({
    title: p ? 'Editar proyecto' : 'Nuevo proyecto',
    values: p || {color:initial, profileId:''},
    preview: v => pvProject({...v, color:resolve(v)}),
    fields: [
      {key:'name', label:'Nombre del proyecto', required:true},
      {key:'profileId', label:'Perfil', type:'select', options:profileOpts()},
      {key:'color', label:'Color · el mismo para su perfil y todo lo suyo', type:'color'},
      {key:'desc', label:'Descripción', type:'textarea'},
      ...(!p && rmIndex.length ? [{key:'rm', label:'Hoja de ruta (opcional)', type:'select', options:[{v:'', l:'Sin hoja de ruta'}, ...rmIndex.map(e => ({v:e.file, l:e.title}))]}] : [])
    ],
    onSave: v => {
      const {rm, ...rest} = v;
      rest.color = resolve(v);
      if (p) Object.assign(p, rest);
      if (rest.profileId) setFamilyColor(rest.profileId, rest.color);
      if (!p){
        const np = {id:uid(), ...rest}; S.projects.push(np); S.ui.view = 'proyecto'; S.ui.projectId = np.id; S.ui.groups.proyectos = true; closeNav();
        if (rm) applyRoadmap(np.id, rm).then(() => { render(); toast('Hoja de ruta cargada'); }).catch(() => toast('No se pudo cargar la hoja de ruta'));
      }
    },
    onDelete: p ? () => {
      if (!confirm(`¿Eliminar «${p.name}» y todas sus tareas?`)) return false;
      S.projects = S.projects.filter(x => x !== p); S.tasks = S.tasks.filter(t => t.projectId !== p.id); S.ui.view = 'calendario';
    } : null
  });
}

function profileForm(p){
  openForm({
    title: p ? 'Editar perfil' : 'Nuevo perfil',
    values: p || {color:COLORS[S.profiles.length % COLORS.length]},
    preview: pvProfile,
    fields: [
      {key:'name', label:'Nombre', required:true, placeholder:'Ej. Cliente B'},
      {key:'handle', label:'Usuario o descripción', placeholder:'@usuario'},
      {key:'color', label:'Color · también el de sus proyectos y hojas de ruta', type:'color'}
    ],
    onSave: v => {
      let pr = p;
      if (p) Object.assign(p, v); else { pr = {id:uid(), ...v}; S.profiles.push(pr); }
      setFamilyColor(pr.id, v.color); // sus proyectos, hojas de ruta y publicaciones van con el mismo color
      toast('Perfil guardado');
    },
    onDelete: p ? () => {
      if (!confirm(`¿Eliminar el perfil «${p.name}»? Sus publicaciones y proyectos se quedarán sin perfil.`)) return false;
      S.profiles = S.profiles.filter(x => x !== p);
      S.contents.forEach(c => { if (c.profileId === p.id) c.profileId = ''; });
      S.projects.forEach(x => { if (x.profileId === p.id) x.profileId = ''; });
      S.ui.sel = S.ui.sel.filter(h => h !== p.id);
    } : null
  });
}

/* ---------- Actions ---------- */
const actions = {
  menu(){ document.body.classList.toggle('nav-open'); },
  scrim(){ closeNav(); },
  go(el){ S.ui.view = el.dataset.v; closeNav(); if (S.ui.view !== 'calendario') scrollTo(0, 0); render(); },
  group(el){ const g = el.dataset.g; S.ui.groups[g] = !S.ui.groups[g]; render(); },
  openProject(el, id){ S.ui.view = 'proyecto'; S.ui.projectId = id; closeNav(); render(); scrollTo(0, 0); },
  newProject(){ projectForm(); },
  editProject(el, id){ projectForm(project(id)); },
  toggleProfile(el, id){ // pulsar = seleccionar (se suman); volver a pulsar = quitarlo de la selección
    const s = S.ui.sel, i = s.indexOf(id); i >= 0 ? s.splice(i, 1) : s.push(id); render();
  },
  setTab(el){ S.ui.setTab = el.dataset.t; if (S.ui.setTab === 'usuarios') compartidos = null; if (S.ui.setTab === 'datos') copiasNc = null; render(); },
  clearProfiles(){ S.ui.sel = []; render(); toast('Todos los perfiles'); },
  newProfile(){ profileForm(); },
  editProfile(el, id){ profileForm(prof(id)); },
  month(el){ const d = parseISO(S.ui.month + '-01'); d.setMonth(d.getMonth() + Number(el.dataset.n)); S.ui.month = iso(d).slice(0, 7); render(); },
  todayMonth(){ S.ui.selDay = TODAY(); render(); scrollToMonth(TODAY().slice(0, 7), true); dvScroll(TODAY()); },
  selDay(el){
    const d = el.dataset.d, prev = S.ui.selDay;
    S.ui.selDay = d; save();
    document.querySelectorAll('.cell.sel').forEach(c => c.classList.remove('sel')); el.classList.add('sel');
    $('#daypanel').innerHTML = dayPanelHTML(d, calIndex()); dvScroll(d); swapDay(d > prev ? 1 : -1);
  },
  dayShift(el){
    const d = iso(addDays(parseISO(S.ui.selDay), Number(el.dataset.n)));
    S.ui.selDay = d; render(); dvScroll(d); swapDay(Number(el.dataset.n));
    if (d.slice(0, 7) !== iso(addDays(parseISO(d), -Number(el.dataset.n))).slice(0, 7)) scrollToMonth(d.slice(0, 7), true);
  },
  dayView(el){ // reloj = por horas · árbol = por proyecto (se recuerda)
    S.ui.dayView = el.dataset.v; save();
    $('#daypanel').innerHTML = dayPanelHTML(S.ui.selDay, calIndex()); swapDay(0);
    if (S.ui.dayView !== 'arbol') dvScroll(S.ui.selDay);
  },
  slotNew(el){ contentForm(null, el.dataset.d, '', '', pad(Number(el.dataset.h)) + ':00'); },
  pubToggle(el, id){ // publicación hecha ⇄ pendiente (y su paso de la ruta, si lo tiene)
    const c = S.contents.find(x => x.id === id), val = c.status !== 'publicado', l = contentLink(c.id);
    if (l) setDone(l.p, l.s.id, val); else c.status = val ? 'publicado' : 'programado';
    render(); if (val) toast('Publicado');
  },
  rmStepEdit(el){ const p = project(el.dataset.p), s = p.roadmap.data.phases.flatMap(ph => ph.steps).find(x => x.id === el.dataset.id); if (s) stepForm(p, s); },
  newContent(el){ contentForm(null, el.dataset.d || ''); },
  editContent(el, id){ contentForm(S.contents.find(c => c.id === id)); },
  advance(el, id){
    const c = S.contents.find(x => x.id === id);
    const i = STATUSES.findIndex(s => s.k === c.status);
    c.status = STATUSES[(i + 1) % STATUSES.length].k;
    render(); toast(`Estado: ${STATUSES.find(s => s.k === c.status).l}`);
  },
  statusFilter(el){ S.ui.statusFilter = el.dataset.s; render(); },
  mode(el){ S.ui.mode = el.dataset.m; render(); },
  toggleTask(el, id){
    const t = task(id), p = project(t.projectId);
    if (t.rm && p.roadmap){
      const R = p.roadmap;
      if (t.rm.s) setDone(p, t.rm.s, !R.done[t.rm.s]);
      else { const ph = findPhase(p, t.rm.ph), items = phaseItems(ph), all = items.length && items.every(x => R.done[x.id]); items.forEach(x => setDone(p, x.id, !all)); }
    } else t.done = !t.done;
    render();
  },
  editTask(el, id){
    const t = task(id), p = project(t.projectId);
    if (t.rm && p.roadmap){ if (t.rm.s) stepForm(p, findStep(p, t.rm.s)); else phaseForm(p, findPhase(p, t.rm.ph)); return; }
    taskForm(t);
  },
  addSub(el, id){
    const t = task(id), p = project(t.projectId);
    if (t.rm && t.rm.ph && p.roadmap){ stepForm(p, null, findPhase(p, t.rm.ph)); return; }
    taskForm(null, t.projectId, id);
  },
  rmEditMode(){ S.ui.rmEdit = !S.ui.rmEdit; render(); },
  rmHeroEdit(){ heroForm(project(S.ui.projectId)); },
  rmPhaseEdit(el){ const p = project(el.dataset.p); phaseForm(p, findPhase(p, el.dataset.id)); },
  rmPhaseNew(){ phaseForm(project(S.ui.projectId)); },
  rmHabitNew(){ habitForm(project(S.ui.projectId)); },
  rmPubNew(el){
    const p = project(el.dataset.p || S.ui.projectId), ph = findPhase(p, el.dataset.id) || rmCalc(p).phase, t = TODAY();
    contentForm(null, t >= ph.start && t <= ph.end ? t : ph.start, `${p.id}|${ph.id}`, p.profileId || '');
  },
  createMenu(){ createMenu(project(S.ui.projectId)); },
  taskNew(){ taskForm(null, S.ui.projectId, ''); },
  rmHabitEdit(el){ const p = project(el.dataset.p), r = (p.roadmap.data.rituals || []).find(x => x.id === el.dataset.id); if (r) habitForm(p, r); },
  rmStepNew(el){ const p = project(el.dataset.p); stepForm(p, null, findPhase(p, el.dataset.id)); },
  rmMsNew(el){ const p = project(el.dataset.p); msForm(p, findPhase(p, el.dataset.id)); },
  rmMsEdit(el){ const p = project(el.dataset.p), ph = findPhase(p, el.dataset.ph); msForm(p, ph, (ph.milestones || []).find(m => m.id === el.dataset.id)); },
  rmBlank(){
    const p = project(S.ui.projectId), t = TODAY(), id = 'local-' + uid();
    p.roadmap = {src:{id, version:0}, edited:true, done:{}, rituals:{}, cal:{}, dates:{},
      data:{id, version:0, title:p.name, goal:'', color:p.color || '#FF5A36', target:null, rituals:[],
        phases:[{id:'u' + uid(), name:'Fase 1', start:t, end:iso(addDays(new Date(), 13)), steps:[], milestones:[]}]}};
    saveToLibrary(p.roadmap.data);
    S.ui.rmEdit = true; render(); toast('Hoja creada y guardada en Mis hojas. Edítala a tu gusto');
  },
  async rmCopy(){
    const R = project(S.ui.projectId).roadmap;
    const txt = JSON.stringify({...R.data, progreso:{hecho:Object.keys(R.done).filter(k => R.done[k]), fechasCambiadas:R.dates || {}}}, null, 1);
    copyText(txt, 'Copiada. Pégasela a Claude en el chat');
  },
  rmImport(el){ openImportSheet(el.dataset.p || (S.ui.view === 'proyecto' ? S.ui.projectId : '')); },
  rmImportGo(){
    let d;
    try { d = parseRoadmapText($('#rmText').value); } catch (e) { alert(e.message); return; }
    const pid = $('#rmTarget').value;
    saveToLibrary(d);
    if (!pid){ closeSheet(); render(); toast(`«${d.title}» guardada en Mis hojas`); return; }
    const wasSame = project(pid).roadmap && project(pid).roadmap.src.id === d.id;
    if (!applyRoadmapAsk(pid, d, {imported:true})) return;
    S.ui.view = 'proyecto'; S.ui.projectId = pid; S.ui.mode = 'ruta';
    closeSheet(); render(); scrollTo(0, 0); toast(wasSame ? 'Hoja actualizada. Lo marcado se mantiene' : 'Hoja cargada');
  },
  rmUseLib(el, id){ // usar una de Mis hojas en el proyecto abierto
    const e = S.library.find(x => x.id === id), pid = el.dataset.p || S.ui.projectId;
    if (!e || !project(pid)) return;
    if (!applyRoadmapAsk(pid, e.data, {fromLibrary:true})) return;
    S.ui.view = 'proyecto'; S.ui.projectId = pid; S.ui.mode = 'ruta';
    closeSheet(); render(); scrollTo(0, 0); toast('Hoja cargada');
  },
  rmSaveLib(){ const R = project(S.ui.projectId).roadmap; saveToLibrary(R.data); render(); toast('Guardada en Mis hojas'); },
  libUndo(el, id){ // vuelve a la versión anterior a la última actualización de Claude
    const e = S.library.find(x => x.id === id); if (!e || !(e.prev || e.replaced)) return;
    if (!confirm(`¿Deshacer la última actualización de Claude en «${e.title}»? Lo marcado como hecho se mantiene.`)) return;
    const {prev, replaced} = e;
    if (prev){
      S.projects.filter(p => p.roadmap && p.roadmap.src.id === id && !(replaced && replaced.pid === p.id)).forEach(p => applyRoadmapData(p.id, prev));
      e.data = clone(prev); e.title = prev.title || e.title;
    }
    if (replaced && project(replaced.pid)) applyRoadmapData(replaced.pid, replaced.data);
    delete e.prev; delete e.replaced; delete e.byClaude; e.updated = Date.now();
    render(); toast('Actualización deshecha');
  },
  libCopy(el, id){ const e = S.library.find(x => x.id === id); if (e) copyText(JSON.stringify(e.data, null, 1), 'Copiada. Pégasela a Claude en el chat'); },
  libDelete(el, id){
    const e = S.library.find(x => x.id === id); if (!e) return;
    const using = S.projects.filter(p => p.roadmap && p.roadmap.src.id === id).map(p => p.name);
    if (!confirm(`¿Quitar «${e.title}» de Mis hojas?${using.length ? ` Los proyectos que la usan (${using.join(', ')}) la conservan.` : ''}`)) return;
    S.library = S.library.filter(x => x !== e); render();
  },
  libUseIn(el, id){ // elegir en qué proyecto poner una hoja guardada
    const e = S.library.find(x => x.id === id); if (!e) return;
    openForm({title:`Usar «${e.title}»`, values:{pid:S.projects[0] ? S.projects[0].id : ''},
      fields:[{key:'pid', label:'¿En qué proyecto?', type:'select', options:S.projects.map(p => ({v:p.id, l:p.name + (p.roadmap ? ' (tiene hoja)' : '')}))}],
      onSave: v => { if (!v.pid) return; if (applyRoadmapAsk(v.pid, e.data, {fromLibrary:true})){ S.ui.view = 'proyecto'; S.ui.projectId = v.pid; S.ui.mode = 'ruta'; toast('Hoja cargada'); } }});
  },
  libNew(){ // crear una hoja nueva desde Configuración: se pone en un proyecto para editarla
    openForm({title:'Nueva hoja de ruta', values:{title:'', pid:S.projects[0] ? S.projects[0].id : ''},
      fields:[{key:'title', label:'Nombre de la hoja', required:true, placeholder:'Ej. Lanzamiento de la web'},
              {key:'pid', label:'¿En qué proyecto la creas?', type:'select', options:S.projects.map(p => ({v:p.id, l:p.name + (p.roadmap ? ' (sustituye su hoja)' : '')}))}],
      onSave: v => {
        const p = project(v.pid); if (!p) return;
        if (p.roadmap && !confirm(`${p.name} ya tiene «${p.roadmap.data.title}». ¿Sustituirla? (sigue guardada en Mis hojas)`)) return;
        const t = TODAY(), id = 'local-' + uid();

  calOpen(el){ abrirEvento(el.dataset.href, el.dataset.rid || ''); },
  calSyncNow(){ andCall('syncNow'); calInfo = null; toast('Sincronizando con Nextcloud…'); },
  calActivo(el){ S.calendario.activo = el.checked; calCache = null; render(); andCall('syncNow'); },
  calVis(el){
    const todos = (calListado().calendarios || []).map(c => c.href), vis = new Set(S.calendario.visibles || todos);
    el.checked ? vis.add(el.dataset.id) : vis.delete(el.dataset.id);
    S.calendario.visibles = todos.filter(h => vis.has(h)); calCache = null; render(); andCall('syncNow');
  },
  calVinc(el){ S.calendario.vincular[el.dataset.k] = el.checked; render(); andCall('syncNow'); toast(el.checked ? 'Se llevará a tu calendario' : 'Se quitará de tu calendario'); },
  enablePush(){ andCall('requestNotifications'); }, // responde con onPizarraAndroid('notif')
  testPush(){ andCall('testNotification'); },
  disablePush(){ andCall('disableNotifications'); lastSent = ''; render(); toast('Avisos desactivados en este móvil'); },
  /* ---- Cuenta de Nextcloud (app Android) ---- */
  ncSync(){ andCall('syncNow'); toast('Sincronizando…'); },
  ncDisconnect(){
    const st = andJSON('syncState') || {};
    if (!confirm(st.pendientes ? `Hay ${st.pendientes} cambio${st.pendientes === 1 ? '' : 's'} que aún no ha${st.pendientes === 1 ? '' : 'n'} llegado a Nextcloud y se perderán. ¿Desconectar igualmente?`
      : '¿Desconectar tu cuenta de Nextcloud de este móvil? Tus datos siguen en Nextcloud; en el móvil se borran.')) return;
    andCall('disconnect');
  },
  /* ---- Cuenta de Nextcloud (web servida desde Nextcloud) ---- */
  async nubeConectar(){
    try { await PizarraNube.iniciarLogin(); render(); }
    catch (e) { toast(e.message === 'Failed to fetch' ? 'Sin conexión con Nextcloud' : e.message); }
  },
  nubeCancelar(){ PizarraNube.cancelarLogin(); render(); },
  async nubeManual(){
    const u = (($('#nubeUser') || {}).value || '').trim(), p = (($('#nubePass') || {}).value || '').replace(/\s+/g, '');
    if (!u || !p){ toast('Escribe tu usuario y la contraseña de aplicación'); return; }
    try { await PizarraNube.guardarCuenta(u, p); toast('Conectado con Nextcloud'); render(); }
    catch (e) { toast(e.message === 'Failed to fetch' ? 'Sin conexión con Nextcloud' : e.message); }
  },
  nubeSync(){ PizarraNube.sincronizar(); toast('Sincronizando…'); },
  async nubeDesconectar(){
    const st = PizarraNube.estado();
    if (!confirm(st.pendientes ? `Hay ${st.pendientes} cambio${st.pendientes === 1 ? '' : 's'} que aún no ha${st.pendientes === 1 ? '' : 'n'} llegado a Nextcloud y se perderán. ¿Desconectar igualmente?`
      : '¿Desconectar tu cuenta de Nextcloud de este navegador? Tus datos siguen en Nextcloud.')) return;
    await PizarraNube.desconectar();
    S = ensureDefaults({...blankData(), ui:S.ui, device:S.device}); save(); render(); toast('Cuenta desconectada');
  },
  shareSave(){
    const con = ($('#shareCon') || {}).value || '', que = [...document.querySelectorAll('.shareQue:checked')].map(x => x.value);
    if (!con.trim()){ toast('Escribe el usuario de Nextcloud de tu administrador'); return; }
    if (!que.length){ toast('Marca al menos una cosa para compartir'); return; }
    shareBusy = true; andCall('shareSet', JSON.stringify({con:con.trim(), que, activo:true})); render();
  },
  shareOff(){ const cfg = andJSON('shareGet') || {}; shareBusy = true; andCall('shareSet', JSON.stringify({...cfg, activo:false})); render(); },
  shReload(){ compartidos = null; render(); },
  shAccept(el, id){ andCall('shareAccept', id); toast('Aceptando…'); },
  shOpen(el){
    const s = (compartidos.lista || [])[Number(el.dataset.i)], sh = $('#sheet'); if (!s) return;
    const m = s.metricas || {};
    delete sh.dataset.day; sh.classList.remove('has-pv');
    sh.innerHTML = `<div class="sheet-bg" data-act="closeSheet"></div><div class="sheet"><div class="grab"></div>
      <div class="sheet-h"><h2>${esc(m.user ? m.user.name : s.nombre)}</h2><button type="button" class="icon-btn" data-act="closeSheet" aria-label="Cerrar">${ic('x')}</button></div>
      <p class="muted small" style="margin:-6px 0 12px">${esc(s.propietario)}${m.actualizado ? ' · actualizado ' + fechaHora(m.actualizado) : ''}</p>
      ${s.error ? `<div class="note"><b>No se pudo leer</b>${esc(s.error)}</div>` : adminMetricsHTML(m)}</div>`;
    sh.classList.add('open'); document.body.classList.add('locked');
  },
  confOtra(el, cid){ if (andCall('conflictResolve', cid, 'otra')) ncAdopt(); render(); toast('Recuperada la otra versión'); },
  confMia(el, cid){ andCall('conflictResolve', cid, 'mia'); render(); },
  ncRestore(el, fecha){ andCall('backupLoad', fecha); toast('Descargando la copia…'); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = actions[el.dataset.act];
  if (fn && VIS && VIS_RO.has(el.dataset.act)){ e.preventDefault(); e.stopPropagation(); toast('Es un visor: solo lectura'); return; }
  if (fn){ e.preventDefault(); e.stopPropagation(); tapFx(e, el); fn(el, el.dataset.id); popAfter(el); }
});
/* Respuesta visual a cada toque */
function tapFx(e, el){
  if (calmMotion() || !e.clientX && !e.clientY || el.matches('.sheet-bg')) return;
  const f = document.createElement('span'); f.className = 'tapfx';
  f.style.left = e.clientX + 'px'; f.style.top = e.clientY + 'px';
  document.body.appendChild(f); setTimeout(() => f.remove(), 500);
}
function swapDay(dir){ // el panel del día entra desde el lado hacia el que avanzas
  const p = $('#daypanel'); if (!p || calmMotion()) return;
  p.style.setProperty('--sx', (dir > 0 ? 18 : dir < 0 ? -18 : 0) + 'px');
  p.classList.remove('swap'); void p.offsetWidth; p.classList.add('swap');
}
const POP_SEL ='.cb,.ritual,.calchip,.set-tabs button,.seg button,.dv-switch button,.pill,.pchip,.cell';
function popAfter(old){ // tras repintar, busca el mismo botón y le da un pequeño salto; si una fila pasa a hecha, destella en verde
  const d = old.dataset, q = `[data-act="${d.act}"]` + ['id', 'p', 'd', 't', 'v', 'm'].filter(k => d[k] != null).map(k => `[data-${k}="${CSS.escape(d[k])}"]`).join('');
  const el = old.isConnected ? old : document.querySelector(q);
  if (!el || !el.matches(POP_SEL)) return;
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  setTimeout(() => el.classList.remove('pop'), 500);
  const row = el.matches('.cb,.ritual') && el.closest('.task,.step,.ms,.crow');
  if (row && (row.classList.contains('done') || el.classList.contains('on'))){ row.classList.add('flash'); setTimeout(() => row.classList.remove('flash'), 750); }
}
document.addEventListener('submit', e => {
  if (e.target.id !== 'quickAdd') return;
  e.preventDefault();
  const f = e.target, title = f.elements.t.value.trim();
  if (!title) return;
  const pid = S.ui.projectId;
  S.tasks.push({id:uid(), projectId:pid, parentId:'', title, priority:f.elements.p.value, due:'', notes:'', done:false, order:nextOrder(pid, '')});
  render();
  const i = $('#quickAdd input'); i && i.focus();
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-set]');
  if (!el) return;
  const [a, b] = el.dataset.set.split('.');
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (el.type === 'time' && !v) return;
  if (el.dataset.num === 'true') v = Number(v);
  S.notif[a][b] = v;
  render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ closeSheet(); closeNav(); } });
document.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.actChange === 'calPiz'){ S.calendario.pizarra = e.target.value; render(); andCall('syncNow'); toast('Pizarra usará ese calendario'); return; }
  if (e.target.id !== 'updChannel') return;
  toast(andCall('setUpdateChannel', e.target.value.trim()) ? 'Enlace guardado' : 'Ese enlace no parece un enlace público de Nextcloud (…/s/…)');
});
$('#importFile').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!['profiles', 'contents', 'projects', 'tasks'].every(k => Array.isArray(d[k]))) throw new Error('formato');
      d.device = S.device; d.notif = S.notif; // los avisos son de este dispositivo
      S = ensureDefaults(d); render(); toast('Copia importada');
    } catch (err) { alert('Ese archivo no es una copia válida de Pizarra.'); }
    e.target.value = '';
  };
  r.readAsText(file);
});

/* Visor de Health: importar la copia de otra persona (no toca tus datos) */
let visTarget = '';
Object.assign(actions, {
  visorVer(el){
    const id = el.dataset.id || '';
    if (VIS) visorSalir();
    if (id){ const p = visList().find(x => x.id === id); if (!p) return render(); MINE = S.health; S.health = visHealth(p.health); VIS = {id:p.id, nombre:p.nombre, importada:p.importada}; }
    render(); scrollTo(0, 0);
  },
  visorImportar(el){ visTarget = el.dataset.id || ''; $('#visorFile').click(); },
  visorQuitar(el){
    const id = el.dataset.id, p = visList().find(x => x.id === id);
    if (!p || !confirm(`¿Quitar el visor de ${p.nombre}? Solo se borra de este dispositivo.`)) return;
    if (VIS && VIS.id === id){ S.health = MINE; MINE = null; VIS = null; }
    visStore(visList().filter(x => x.id !== id)); render(); toast('Visor quitado');
  },
});
$('#visorFile').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    e.target.value = '';
    let d; try { d = JSON.parse(r.result); } catch (err) { d = null; }
    if (!d || typeof d.health !== 'object' || !d.health){ alert(d && d.peso ? 'Ese metricas.json es de una versión antigua de la app: que esa persona actualice Pizarra en su Android y abra la app una vez.' : 'Ese archivo no es una copia de Pizarra con datos de Health.'); return; }
    const l = visList(), old = l.find(x => x.id === visTarget);
    const suyo = d.user && d.user.name ? String(d.user.name) : '';   // metricas.json de su carpeta compartida
    const nombre = old ? old.nombre : (prompt('¿De quién es esta copia?', suyo) || '').trim();
    if (!nombre) return;
    const p = {id:old ? old.id : uid(), nombre, importada:new Date().toISOString(), health:visHealth(d.health)};
    if (old) l[l.indexOf(old)] = p; else l.push(p);
    if (!visStore(l)){ alert('No hay espacio en este dispositivo para guardar la copia.'); return; }
    if (VIS){ S.health = MINE; MINE = null; VIS = null; }  // sin guardar la vista anterior: la copia nueva manda
    MINE = S.health; S.health = visHealth(p.health); VIS = {id:p.id, nombre:p.nombre, importada:p.importada};
    S.ui.view = 'health'; render(); scrollTo(0, 0); toast(old ? `Copia de ${nombre} actualizada` : `Ya puedes ver el Health de ${nombre}`);
  };
  r.readAsText(file);
});

$('#menuBtn').innerHTML = ic('menu');
$('#fab').innerHTML = ic('plus');
if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; // que el calendario siempre abra en el mes actual
load();
render();
loadRmIndex();
nubeIniciar();
if (NC){
  setTimeout(checkInbox, 800);              // hojas que Claude dejó en el buzón de Nextcloud
  if (notifOn()) syncPush(true);            // renueva la agenda de avisos del móvil
  andHealthAuto();                          // pesadas nuevas de Health Connect
  if (!ncReady) toast('Conectando con tu Nextcloud…');
}
